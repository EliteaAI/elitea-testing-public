<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/forward-auth/auth_form/static/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/forward-auth/auth_form/static/css/login.css" rel="stylesheet">
    <title>Centry login</title>
  </head>
  <body class="text-center bg-body-tertiary">
    <div class="card card-signin mx-auto">
      <div class="form-signin">
        <form action="/forward-auth/auth_form/authorize" method="post">
          <div class="form-floating">
            <input type="text" class="form-control" id="login" name="login" placeholder="Login">
            <label for="login">Login</label>
          </div>
          <div class="form-floating">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password">
            <label for="password">Password</label>
          </div>
          <input type="hidden" name="target" value="">
          <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <script src="/forward-auth/auth_form/static/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/forward-auth/auth_form/static/js/login.js"></script>
  </body>
</html>
