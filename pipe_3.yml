state:
  input:
    type: str
  messages:
    type: list
  run_id:
    type: str
    value: ''
  repo:
    type: str
    value: ''
  conclusion:
    type: str
    value: ''
  workflow_name:
    type: str
    value: ''
entry_point: Parse Webhook
nodes:
  - id: Parse Webhook
    type: code
    code:
      type: fixed
      value: |
        import json
        raw = alita_state.get('input', '{}')
        payload = json.loads(raw) if isinstance(raw, str) else raw
        workflow_run = payload.get('workflow_run', {})
        {
            'run_id': str(workflow_run.get('id', 'unknown')),
            'repo': payload.get('repository', {}).get('full_name', 'unknown'),
            'conclusion': workflow_run.get('conclusion', 'unknown'),
            'workflow_name': workflow_run.get('name', 'unknown')
        }
    input:
      - input
    output:
      - run_id
      - repo
      - conclusion
      - workflow_name
    structured_output: true
    transition: Report
  - id: Report
    type: printer
    message: "Parsed: run_id={{run_id}}, repo={{repo}}, conclusion={{conclusion}}, workflow={{workflow_name}}"
    transition: END
