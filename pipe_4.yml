state:
  input:
    type: str
  messages:
    type: list
  run_id:
    type: str
    value: ''
  conclusion:
    type: str
    value: ''
entry_point: Parse
nodes:
  - id: Parse
    type: code
    code:
      type: fixed
      value: |
        import json
        raw = alita_state.get('input', '{}')
        payload = json.loads(raw) if isinstance(raw, str) else raw
        workflow_run = payload.get('workflow_run', {})
        {
            'run_id': str(workflow_run.get('id', 'unknown')),
            'conclusion': workflow_run.get('conclusion', 'unknown')
        }
    input:
      - input
    output:
      - run_id
      - conclusion
    structured_output: true
    transition: CheckFailure
  - id: CheckFailure
    type: router
    input:
      - conclusion
    condition: |
      {% if conclusion == 'failure' %}
      ProcessFailure
      {% else %}
      SkipNonFailure
      {% endif %}
    routes:
      - ProcessFailure
      - SkipNonFailure
    default_output: SkipNonFailure
  - id: ProcessFailure
    type: printer
    message: "FAILURE detected! Run ID: {{run_id}}, processing..."
    transition: END
  - id: SkipNonFailure
    type: printer
    message: "Skipping non-failure (conclusion: {{conclusion}})"
    transition: END
