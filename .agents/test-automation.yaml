# TMS + pipeline configuration — seeded by scout 2026-07-10.
# Read by test-automation-lead (intake, back-write) and the pipeline skills.

tms:
  # Custom adapter: onetest — markdown case files + GitHub-issue executions/defects.
  # Not one of the built-in adapters (zephyr/testrail/xray/azure/markdown); the
  # MCP server exposes the verbs directly.
  adapter: onetest
  transport: mcp
  mcp_server: onetest-tms          # wired in .mcp.json: npx -y @onetest/tms
  # The MCP package reads .onetest/ relative to cwd — the sibling clone provides it:
  ot_repo_root: ../onetest-ai-tm-Elitea
  cases_repo: EliteaAI/onetest-ai-tm-Elitea
  cases_dir: tests/automated-full-regression-ui   # more folders may be added later
  # Verbs (read): search_test_cases, get_test_case, automation_coverage, build_index
  # Verbs (write — create REAL GitHub issues, never fire casually):
  #   create_run, record_result, complete_run, create_defect, ingest_results
  # Case files are also directly readable:
  #   locally under ot_repo_root, or via
  #   gh api repos/EliteaAI/onetest-ai-tm-Elitea/contents/<path>  (private repo)

intake:
  # How new automation work enters the tracking board. Orchestrator-executed.
  source: tms-folder
  selector:
    tags: ["automated:UI:regression"]
    status: draft
  tracking_repo: EliteaAI/elitea-testing-public
  board: { owner: EliteaAI, number: 9 }
  title_format: "[Automate][ELITEA-<id>] <case title>"
  # Dedup BEFORE filing — any hit (open or closed) means skip.
  # Use the REAL-TIME list API, never --search (search index lags minutes →
  # duplicate filings, cf. issues #17/#18):
  dedup: env -u GITHUB_TOKEN gh issue list --state all --limit 200 --json title
    | grep "ELITEA-<id>"
  # Identity: ALL tracker writes prefixed `env -u GITHUB_TOKEN` — run as the
  # keyring account, never the shared GITHUB_TOKEN (see profile.md § Issue tracker).
  issue_body: name the source file path + the case metadata
  board_placement: auto-add only — set NO status, assign NOBODY; a human approves
    by dragging to Approved
  max_new_cards_per_run: 10        # more arrive next tick
  already_automated_when:          # ALL three must hold — exclude such cases
    execution_type: automated
    status: ready
    automation_test_id: non-empty
  contradictory_metadata: report in the run summary — never guess, never file,
    never skip silently

backwrite_on_done:
  # Post-merge, orchestrator's job — edit the case file in cases_repo:
  execution_type: automated
  status: ready
  # automation_test_id — the CI CORRELATION KEY (ground truth, not style). onetest-tms
  # correlate_results matches it ⇄ the JUnit `code_ref`, which _junit.py builds as
  # `classname + "." + name`. _correlate.norm() only does strip + "::"→":" + drop-spaces
  # + lowercase — it does NOT turn "/"→"." or strip ".py". pytest runs from cwd=automation/
  # and there is NO automation/__init__.py, so the JUnit classname is rooted at `tests`.
  # ⇒ the ONE form that correlates is dotted + tests-rooted (call it "Form C"):
  automation_test_id: tests.<pkg.path>.<module>.<Class>.<method>   # e.g.
    # tests.ui.agents.test_agent_management.TestAgentConfiguration.test_agent_toolkits_section_visible
    # (unclassed test → tests.<...>.<module>.<func>, i.e. drop the <Class> segment)
    #
    # BOTH other forms fail correlation SILENTLY (🟥 gap in automation_coverage, never a match):
    #   ✗ node-id:            automation/tests/ui/x/test_y.py::TestY::test_z   (has / .py ::)
    #   ✗ automation- prefix: automation.tests.ui.x.test_y.TestY.test_z       (extra pkg root)
    #   ✓ correct (Form C):   tests.ui.x.test_y.TestY.test_z
    # History: the 2026-07-14 audit caught node-id drift (4/11); ELITEA-1794 / issue #598
    # (2026-07-23, verified against the onetest-tms engine) caught the automation.-prefix
    # drift too and settled Form C as canon. Fix EITHER wrong form on sight.
    #
    # Derive mechanically from the node-id you ran — or read it straight from
    # reports/junit.xml (classname + "." + name):
    #   automation/tests/ui/x/test_y.py::TestY::test_z
    #   → drop "automation/", drop ".py", "/"→".", "::"→"."  ⇒  tests.ui.x.test_y.TestY.test_z
    # Self-check before committing the back-write (run from automation/):
    #   t="tests.ui.x.test_y.TestY.test_z"
    #   grep -qi "classname=\"${t%.*}\".*name=\"${t##*.}\"" reports/junit.xml && echo MATCH || echo NO-MATCH
    #
    # ⚠ index.json is NOT auto-rebuilt (build-index CI is a stub). After editing case files,
    #   rebuild it (build_index MCP verb, or the packaged scripts/_index.py) or correlate_results
    #   reads the stale ref and still reports a gap.
  automation_pr: URL of the merged automation/base PR (observed practice, now policy)

reporting:
  # No pytest-wired TMS reporter exists and none should be added silently.
  # Back-writes are explicit orchestrator actions (above), never per-local-run.
  pytest_tms_reporter: none
