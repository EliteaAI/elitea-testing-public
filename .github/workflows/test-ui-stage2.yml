name: UI Tests STAGE2
run-name: UI Tests STAGE2 [${{ inputs.ref || 'aqa/main-stage2' }}] [${{ inputs.custom_suites || inputs.suite || 'all' }}]

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite'
        type: choice
        options: [all, agents, admin, artifacts, chat, pipelines, skills, smoke, support_assistant, toolkits, voice]
        default: all
      custom_suites:
        description: 'Custom suites (comma-separated)'
        type: string
        default: ''
      markers:
        description: 'Pytest markers'
        default: ''
      ref:
        description: 'Git branch/tag/SHA'
        type: string
        default: 'aqa/main-stage2'
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name'
        type: string
        default: ''

jobs:
  test:
    uses: ./.github/workflows/test-ui-custom.yml
    with:
      environment: stage2
      suite: ${{ inputs.suite || 'all' }}
      custom_suites: ${{ inputs.custom_suites || '' }}
      markers: ${{ inputs.markers || '' }}
      ref: ${{ inputs.ref || 'aqa/main-stage2' }}
      publish_to_tms: ${{ inputs.publish_to_tms }}
      tms_report_suffix: ${{ inputs.tms_report_suffix || '' }}
    secrets:
      ELITEA_URL: ${{ secrets.ELITEA_URL_STAGE2 }}
      ELITEA_API_BASE: ${{ secrets.ELITEA_API_BASE_STAGE2 }}
      ELITEA_API_TOKEN: ${{ secrets.ELITEA_API_TOKEN_STAGE2 }}
      ELITEA_PROJECT_ID: ${{ secrets.ELITEA_PROJECT_ID_STAGE2 }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL_STAGE2 }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD_STAGE2 }}
      # Indexed project IDs for parallel suite execution (env-specific)
      TEST_USER_PROJECT_1: ${{ secrets.TEST_USER_PROJECT_STAGE2_1 }}
      TEST_USER_PROJECT_2: ${{ secrets.TEST_USER_PROJECT_STAGE2_2 }}
      TEST_USER_PROJECT_3: ${{ secrets.TEST_USER_PROJECT_STAGE2_3 }}
      TEST_USER_PROJECT_4: ${{ secrets.TEST_USER_PROJECT_STAGE2_4 }}
      TEST_USER_PROJECT_5: ${{ secrets.TEST_USER_PROJECT_STAGE2_5 }}
      TEST_USER_PROJECT_6: ${{ secrets.TEST_USER_PROJECT_STAGE2_6 }}
      TEST_USER_PROJECT_7: ${{ secrets.TEST_USER_PROJECT_STAGE2_7 }}
      TEST_USER_PROJECT_8: ${{ secrets.TEST_USER_PROJECT_STAGE2_8 }}
      TEST_USER_PROJECT_9: ${{ secrets.TEST_USER_PROJECT_STAGE2_9 }}
      TEST_USER_PROJECT_10: ${{ secrets.TEST_USER_PROJECT_STAGE2_10 }}
      # Indexed tokens for parallel suite execution (env-specific)
      TEST_USER_TOKEN_1: ${{ secrets.TEST_USER_TOKEN_STAGE2_1 }}
      TEST_USER_TOKEN_2: ${{ secrets.TEST_USER_TOKEN_STAGE2_2 }}
      TEST_USER_TOKEN_3: ${{ secrets.TEST_USER_TOKEN_STAGE2_3 }}
      TEST_USER_TOKEN_4: ${{ secrets.TEST_USER_TOKEN_STAGE2_4 }}
      TEST_USER_TOKEN_5: ${{ secrets.TEST_USER_TOKEN_STAGE2_5 }}
      TEST_USER_TOKEN_6: ${{ secrets.TEST_USER_TOKEN_STAGE2_6 }}
      TEST_USER_TOKEN_7: ${{ secrets.TEST_USER_TOKEN_STAGE2_7 }}
      TEST_USER_TOKEN_8: ${{ secrets.TEST_USER_TOKEN_STAGE2_8 }}
      TEST_USER_TOKEN_9: ${{ secrets.TEST_USER_TOKEN_STAGE2_9 }}
      TEST_USER_TOKEN_10: ${{ secrets.TEST_USER_TOKEN_STAGE2_10 }}
      # Indexed user credentials for parallel suite execution
      TEST_USER_NAME_1: ${{ secrets.TEST_USER_NAME_1 }}
      TEST_USER_PASSWORD_1: ${{ secrets.TEST_USER_PASSWORD_1 }}
      TEST_USER_NAME_2: ${{ secrets.TEST_USER_NAME_2 }}
      TEST_USER_PASSWORD_2: ${{ secrets.TEST_USER_PASSWORD_2 }}
      TEST_USER_NAME_3: ${{ secrets.TEST_USER_NAME_3 }}
      TEST_USER_PASSWORD_3: ${{ secrets.TEST_USER_PASSWORD_3 }}
      TEST_USER_NAME_4: ${{ secrets.TEST_USER_NAME_4 }}
      TEST_USER_PASSWORD_4: ${{ secrets.TEST_USER_PASSWORD_4 }}
      TEST_USER_NAME_5: ${{ secrets.TEST_USER_NAME_5 }}
      TEST_USER_PASSWORD_5: ${{ secrets.TEST_USER_PASSWORD_5 }}
      TEST_USER_NAME_6: ${{ secrets.TEST_USER_NAME_6 }}
      TEST_USER_PASSWORD_6: ${{ secrets.TEST_USER_PASSWORD_6 }}
      TEST_USER_NAME_7: ${{ secrets.TEST_USER_NAME_7 }}
      TEST_USER_PASSWORD_7: ${{ secrets.TEST_USER_PASSWORD_7 }}
      TEST_USER_NAME_8: ${{ secrets.TEST_USER_NAME_8 }}
      TEST_USER_PASSWORD_8: ${{ secrets.TEST_USER_PASSWORD_8 }}
      TEST_USER_NAME_9: ${{ secrets.TEST_USER_NAME_9 }}
      TEST_USER_PASSWORD_9: ${{ secrets.TEST_USER_PASSWORD_9 }}
      TEST_USER_NAME_10: ${{ secrets.TEST_USER_NAME_10 }}
      TEST_USER_PASSWORD_10: ${{ secrets.TEST_USER_PASSWORD_10 }}
      GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
      ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
      CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
      CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      ZEPHYR_API_KEY: ${{ secrets.ZEPHYR_API_KEY }}
      ZEPHYR_ESENTIALS_KEY: ${{ secrets.ZEPHYR_ESENTIALS_KEY }}
      GITLAB_PRIVATE_TOKEN: ${{ secrets.GITLAB_PRIVATE_TOKEN }}
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
