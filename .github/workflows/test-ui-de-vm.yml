name: UI Tests DE-VM
run-name: UI Tests DE-VM [${{ inputs.ref || 'main' }}] [${{ inputs.custom_suites || inputs.suite || 'all' }}]

# TEMPORARY workflow — a clone of test-ui-dev.yml pointed at a different HOST.
#
# Everything except the host is identical to DEV: every credential, project id,
# token and toolkit secret is read from the SAME `*_DEV*` keys. Only ELITEA_URL /
# ELITEA_API_BASE are overridden, and they are overridden HERE as literals rather
# than via new `*_DE_VM` secrets — so no repo secret has to be added for this to
# run, and nothing has to be cleaned up afterwards beyond deleting this file.
#
# Nothing outside this file is touched: test-ui-custom.yml (the called base
# workflow) and test-ui-dev.yml are unchanged, and every workaround this target
# needs lives below.
#
# Workarounds / deliberate deviations from test-ui-dev.yml:
#   1. HOST OVERRIDE. `secrets.ELITEA_URL` / `ELITEA_API_BASE` are passed as plain
#      strings. The callee prefers `secrets.ELITEA_URL` over its
#      `ELITEA_URL_{ENV}` lookup (test-ui-custom.yml:518-519) and uses the same
#      secret's presence to detect workflow_call mode (:248, :432), so a literal
#      satisfies both. GitHub masks any value passed through `secrets:`, so the
#      host shows as *** in logs — expected, same as on DEV.
#   2. ENV NAME = `de-vm`, not `dev`. The callee derives artifact names, the
#      gh-pages report path (`<env>/<run>/`) and the TMS RUN_ID from it, so
#      reusing `dev` would overwrite real DEV reports and collide with DEV run
#      ids. `environment` is a free-form string on the workflow_call side
#      (test-ui-custom.yml:93-96), so `de-vm` needs no change there. Credentials
#      are unaffected: they are passed explicitly below, never looked up by env
#      name.
#   3. NO SCHEDULE. Dispatch-only while this target is temporary — a second
#      nightly would feed a second maintenance report for a host that may not be
#      permanent. To enable, uncomment the `schedule` block below; the `links`
#      and `notify` jobs already handle the schedule event.
#   4. `enable_results_processing` / `publish_to_tms` default OFF, as on DEV
#      dispatch. Turning them on writes a maintenance report named after THIS
#      workflow and a TMS run id tagged `DE-VM` — separate from DEV either way.

on:
  # Uncomment to run nightly (DEV runs at 23:00; offset to avoid two publishes
  # racing for the single gh-pages commit — see test-ui-custom.yml `publish`).
  # schedule:
  #   - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite'
        type: choice
        options: [all, agents, admin, artifacts, chat, pipelines, pipelines_2, skills, smoke, support_assistant, toolkits, voice]
        default: all
      custom_suites:
        description: 'Custom suites (comma-separated). Leave empty to discover all suites dynamically.'
        type: string
        default: ''
      parallel_jobs:
        description: 'Number of parallel runners (1-9)'
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8', '9']
        default: '9'
      markers:
        description: 'Pytest markers. Default = stable only. Use "new or blocked or flaky" for unstable, "all" for everything.'
        default: 'not new and not blocked and not flaky'
      ref:
        description: 'Git branch/tag/SHA'
        type: string
        default: 'main'
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name'
        type: string
        default: ''
      enable_results_processing:
        description: 'Send results for processing'
        type: boolean
        default: false

jobs:
  links:
    # Runs first so its summary is shown at the top of the run page
    name: Run reports
    runs-on: ubuntu-latest
    outputs:
      run_name: ${{ steps.links.outputs.run_name }}
    steps:
      - name: Add report links to run summary
        id: links
        env:
          SUITES: ${{ inputs.custom_suites || inputs.suite || 'all' }}
          # Schedule forces results processing ON (so the maintenance report is fed)
          # but NOT TMS publishing — that follows the dispatch default, i.e. off.
          RESULTS_PROCESSING: ${{ github.event_name == 'schedule' || inputs.enable_results_processing == true }}
          PUBLISH_TO_TMS: ${{ inputs.publish_to_tms == true }}
        run: |
          # Build run name (github.run_name not available in called workflow context)
          RUN_NAME="UI Tests DE-VM [${{ github.ref_name }}] [${SUITES}]"
          echo "run_name=$RUN_NAME" >> $GITHUB_OUTPUT

          # Maintenance report name - same sanitization as ParseWebhook in
          # automation/routines/test_failure_intake.yml: lower, ' '->'-', '_'->'-', drop '[' and ']'
          REPORT_NAME=$(echo "$RUN_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g; s/_/-/g; s/[][]//g')
          REPORT_PATH=$(jq -rn --arg s "$REPORT_NAME" '$s | split("/") | map(@uri) | join("/")')
          REPORT_URL="${{ github.server_url }}/${{ github.repository }}/blob/automation/maintenance/automation/maintenance/${REPORT_PATH}.md"
          DASHBOARD_URL="${{ github.server_url }}/EliteaAI/onetest-ai-tm-Elitea/blob/main/reports/dashboard.md"

          {
            echo "## 📑 Run reports"
            echo ""
            echo "- 🛠️ [Maintenance report](${REPORT_URL}) (cumulative for all runs named \`${RUN_NAME}\`)"
            echo "- 📊 [Test dashboard](${DASHBOARD_URL})"
            echo ""
            echo "> ⏳ Reports will be updated within minutes after the run completes and all results are processed and uploaded."
            if [ "$RESULTS_PROCESSING" != "true" ]; then
              echo ">"
              echo "> ⚠️ Results processing is disabled for this run, so it will not be added to the maintenance report."
            fi
            if [ "$PUBLISH_TO_TMS" != "true" ]; then
              echo ">"
              echo "> ⚠️ Publishing to TMS is disabled for this run, so the dashboard will not be updated."
            fi
            echo ""
            echo "> 🧪 Temporary target: this run uses the DEV credential set against the DE-VM host."
          } >> $GITHUB_STEP_SUMMARY

  test:
    needs: links
    uses: ./.github/workflows/test-ui-custom.yml
    with:
      # Workaround 2 — own env name so artifacts / gh-pages / TMS run ids do not
      # collide with the real DEV workflow's.
      environment: de-vm
      suite: ${{ inputs.suite || 'all' }}
      custom_suites: ${{ inputs.custom_suites || '' }}
      parallel_jobs: ${{ inputs.parallel_jobs || '9' }}
      markers: ${{ inputs.markers || 'not new and not blocked and not flaky' }}
      ref: ${{ inputs.ref || 'main' }}
      publish_to_tms: ${{ inputs.publish_to_tms || false }}
      tms_report_suffix: ${{ inputs.tms_report_suffix || '' }}
      # Inert unless publish_to_tms is true — the correlation steps live inside the
      # callee's `publish-tms` job, which is itself gated on that input.
      update_correlation: true
    secrets:
      # Workaround 1 — THE ONLY DIFFERENCE FROM test-ui-dev.yml: the host.
      # Literals, not `*_DE_VM` secrets, so this needs no repo-secret setup.
      # If a real ELITEA_URL_DE_VM / ELITEA_API_BASE_DE_VM secret is added later,
      # swap these two lines for `${{ secrets.ELITEA_URL_DE_VM }}` etc.
      ELITEA_URL: https://de-vm.elitea.ai
      ELITEA_API_BASE: https://de-vm.elitea.ai/api/v2
      # Everything below is byte-identical to test-ui-dev.yml — the DEV keys.
      # ELITEA_API_TOKEN / ELITEA_PROJECT_ID are deliberately NOT passed: the called
      # workflow resolves them per runner from TEST_USER_TOKEN_{n}/TEST_USER_PROJECT_{n}
      # and never reads the single-value secrets.
      # Indexed project IDs for parallel suite execution (env-specific)
      TEST_USER_PROJECT_1: ${{ secrets.TEST_USER_PROJECT_DEV_1 }}
      TEST_USER_PROJECT_2: ${{ secrets.TEST_USER_PROJECT_DEV_2 }}
      TEST_USER_PROJECT_3: ${{ secrets.TEST_USER_PROJECT_DEV_3 }}
      TEST_USER_PROJECT_4: ${{ secrets.TEST_USER_PROJECT_DEV_4 }}
      TEST_USER_PROJECT_5: ${{ secrets.TEST_USER_PROJECT_DEV_5 }}
      TEST_USER_PROJECT_6: ${{ secrets.TEST_USER_PROJECT_DEV_6 }}
      TEST_USER_PROJECT_7: ${{ secrets.TEST_USER_PROJECT_DEV_7 }}
      TEST_USER_PROJECT_8: ${{ secrets.TEST_USER_PROJECT_DEV_8 }}
      TEST_USER_PROJECT_9: ${{ secrets.TEST_USER_PROJECT_DEV_9 }}
      TEST_USER_PROJECT_ADMIN: ${{ secrets.TEST_USER_PROJECT_DEV_ADMIN }}
      # Indexed tokens for parallel suite execution (env-specific)
      TEST_USER_TOKEN_1: ${{ secrets.TEST_USER_TOKEN_DEV_1 }}
      TEST_USER_TOKEN_2: ${{ secrets.TEST_USER_TOKEN_DEV_2 }}
      TEST_USER_TOKEN_3: ${{ secrets.TEST_USER_TOKEN_DEV_3 }}
      TEST_USER_TOKEN_4: ${{ secrets.TEST_USER_TOKEN_DEV_4 }}
      TEST_USER_TOKEN_5: ${{ secrets.TEST_USER_TOKEN_DEV_5 }}
      TEST_USER_TOKEN_6: ${{ secrets.TEST_USER_TOKEN_DEV_6 }}
      TEST_USER_TOKEN_7: ${{ secrets.TEST_USER_TOKEN_DEV_7 }}
      TEST_USER_TOKEN_8: ${{ secrets.TEST_USER_TOKEN_DEV_8 }}
      TEST_USER_TOKEN_9: ${{ secrets.TEST_USER_TOKEN_DEV_9 }}
      TEST_USER_TOKEN_ADMIN: ${{ secrets.TEST_USER_TOKEN_DEV_ADMIN }}
      # Password template - actual passwords are constructed as TEMPLATE + SUFFIX
      TEST_USER_PASSWORD_TEMPLATE: ${{ secrets.TEST_USER_PASSWORD_TEMPLATE }}
      # Team project ID for multi-user permission tests (global vars, not env-specific)
      ELITEA_TEAM_PROJECT_ID: ${{ vars.ELITEA_TEAM_PROJECT_ID }}
      GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
      ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
      CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
      CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      ZEPHYR_API_KEY: ${{ secrets.ZEPHYR_API_KEY }}
      ZEPHYR_ESENTIALS_KEY: ${{ secrets.ZEPHYR_ESENTIALS_KEY }}
      GITLAB_PRIVATE_TOKEN: ${{ secrets.GITLAB_PRIVATE_TOKEN }}
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE: ${{ secrets.CONFLUENCE_SPACE }}

  notify:
    name: Notify intake pipeline
    needs: [links, test]
    if: always() && (github.event_name == 'schedule' || inputs.enable_results_processing == true)
    runs-on: ubuntu-latest
    steps:
      - name: Download JUnit artifacts for test counts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: false
        continue-on-error: true

      - name: Calculate total test count from JUnit XMLs
        id: counts
        run: |
          TOTAL=0
          # Sum up tests from all junit.xml files
          for xml in $(find test-results -name "junit.xml" 2>/dev/null); do
            COUNT=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | grep -o '[0-9]*' || echo 0)
            TOTAL=$((TOTAL + COUNT))
          done
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total tests across all suites: $TOTAL"

      - name: Send webhook to intake pipeline
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          # Run name built once in the links job (defines the maintenance report file name)
          RUN_NAME="${{ needs.links.outputs.run_name }}"

          # Build JSON payload using jq for proper escaping
          PAYLOAD=$(jq -cn \
            --arg action "completed" \
            --argjson run_id ${{ github.run_id }} \
            --arg name "$RUN_NAME" \
            --arg path ".github/workflows/test-ui-de-vm.yml" \
            --arg html_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson run_number ${{ github.run_number }} \
            --arg head_branch "${{ github.ref_name }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg conclusion "${{ needs.test.result }}" \
            --arg actor "${{ github.actor }}" \
            --arg repo "${{ github.repository }}" \
            --argjson total_tests ${{ steps.counts.outputs.total || 0 }} \
            '{
              action: $action,
              workflow_run: {
                id: $run_id,
                name: $name,
                path: $path,
                html_url: $html_url,
                run_number: $run_number,
                head_branch: $head_branch,
                head_sha: $head_sha,
                conclusion: $conclusion,
                actor: { login: $actor },
                total_tests: $total_tests
              },
              repository: { full_name: $repo }
            }')

          # Compute HMAC-SHA256 signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$MAINTENANCE_SECRET" | sed 's/^.* //')

          # Send webhook with signature header (fail on non-2xx response)
          curl -fsSL -X POST "$MAINTENANCE_URL" \
            -H "Content-Type: text/plain" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
