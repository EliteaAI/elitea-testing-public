name: UI Tests CUSTOM
run-name: UI Tests ${{ inputs.environment || 'CUSTOM' }} [${{ inputs.ref || github.ref_name }}] [${{ inputs.custom_suites || inputs.suite || 'all' }}]

# Base workflow for UI tests - can be called directly or by environment workflows
#
# Usage:
#   1. Manual: Run with full parameter control via workflow_dispatch
#   2. Called: Environment workflows (dev/stage2/next) call this via workflow_call

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - stage2
          - next
          - custom
        default: dev
      custom_environment:
        description: 'Custom environment name (only when environment=custom)'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - all
          - agents
          - admin
          - artifacts
          - chat
          - pipelines
          - skills
          - smoke
          - support_assistant
          - toolkits
          - voice
        default: all
      custom_suites:
        description: 'Custom suites (comma-separated, e.g., "chat,agents")'
        required: false
        type: string
        default: ''
      parallel_jobs:
        description: 'Number of parallel runners (1-9)'
        required: false
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
        default: '9'
      markers:
        description: 'Pytest markers (default excludes new tests; use "new" for new only, "all" for all tests)'
        required: false
        default: 'not new'
      ref:
        description: 'Git ref (branch, tag, SHA). Leave empty for default.'
        required: false
        type: string
        default: ''
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        required: false
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name (e.g., "scheduled", "nightly") (e.g., "scheduled", "nightly")'
        required: false
        type: string
        default: ''
      update_correlation:
        description: 'Rebuild correlation.json + coverage.md in TMS repo after publishing'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      suite:
        description: 'Test suite to run'
        required: false
        type: string
        default: 'all'
      custom_suites:
        description: 'Custom suites (comma-separated, e.g., "agents,chat,pipelines")'
        required: false
        type: string
        default: ''
      parallel_jobs:
        description: 'Number of parallel runners (1-9)'
        required: false
        type: string
        default: '9'
      markers:
        description: 'Pytest markers (default excludes new tests; use "new" for new only, "all" for all tests)'
        required: false
        type: string
        default: 'not new'
      ref:
        description: 'Git ref (branch, tag, SHA)'
        required: false
        type: string
        default: ''
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        required: false
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name (e.g., "scheduled", "nightly")'
        required: false
        type: string
        default: ''
      update_correlation:
        description: 'Rebuild correlation.json + coverage.md in TMS repo after publishing'
        required: false
        type: boolean
        default: false
    secrets:
      ELITEA_URL:
        required: true
      ELITEA_API_BASE:
        required: true
      ELITEA_API_TOKEN:
        required: false
      ELITEA_PROJECT_ID:
        required: false
      # Indexed project IDs for parallel suite execution (env-specific: TEST_USER_PROJECT_[ENV]_X)
      TEST_USER_PROJECT_1:
        required: false
      TEST_USER_PROJECT_2:
        required: false
      TEST_USER_PROJECT_3:
        required: false
      TEST_USER_PROJECT_4:
        required: false
      TEST_USER_PROJECT_5:
        required: false
      TEST_USER_PROJECT_6:
        required: false
      TEST_USER_PROJECT_7:
        required: false
      TEST_USER_PROJECT_8:
        required: false
      TEST_USER_PROJECT_9:
        required: false
      TEST_USER_PROJECT_10:
        required: false
      # Indexed API tokens for parallel suite execution (env-specific: TEST_USER_TOKEN_[ENV]_X)
      TEST_USER_TOKEN_1:
        required: false
      TEST_USER_TOKEN_2:
        required: false
      TEST_USER_TOKEN_3:
        required: false
      TEST_USER_TOKEN_4:
        required: false
      TEST_USER_TOKEN_5:
        required: false
      TEST_USER_TOKEN_6:
        required: false
      TEST_USER_TOKEN_7:
        required: false
      TEST_USER_TOKEN_8:
        required: false
      TEST_USER_TOKEN_9:
        required: false
      TEST_USER_TOKEN_10:
        required: false
      TEST_USER_EMAIL:
        required: false
      TEST_USER_PASSWORD:
        required: false
      TEST_USER_NAME_1:
        required: false
      TEST_USER_PASSWORD_1:
        required: false
      TEST_USER_NAME_2:
        required: false
      TEST_USER_PASSWORD_2:
        required: false
      TEST_USER_NAME_3:
        required: false
      TEST_USER_PASSWORD_3:
        required: false
      TEST_USER_NAME_4:
        required: false
      TEST_USER_PASSWORD_4:
        required: false
      TEST_USER_NAME_5:
        required: false
      TEST_USER_PASSWORD_5:
        required: false
      TEST_USER_NAME_6:
        required: false
      TEST_USER_PASSWORD_6:
        required: false
      TEST_USER_NAME_7:
        required: false
      TEST_USER_PASSWORD_7:
        required: false
      TEST_USER_NAME_8:
        required: false
      TEST_USER_PASSWORD_8:
        required: false
      TEST_USER_NAME_9:
        required: false
      TEST_USER_PASSWORD_9:
        required: false
      TEST_USER_NAME_10:
        required: false
      TEST_USER_PASSWORD_10:
        required: false
      # Team project ID for multi-user tests (bucket permissions, etc.)
      ELITEA_TEAM_PROJECT_ID:
        required: false
      GIT_HUB_TOKEN:
        required: false
      BITBUCKET_TOKEN:
        required: false
      ADO_TOKEN:
        required: false
      CONFLUENCE_USERNAME:
        required: false
      CONFLUENCE_API_KEY:
        required: false
      XRAY_CLIENT_ID:
        required: false
      XRAY_CLIENT_SECRET:
        required: false
      ZEPHYR_API_KEY:
        required: false
      ZEPHYR_ESENTIALS_KEY:
        required: false
      GITLAB_PRIVATE_TOKEN:
        required: false
      POSTMAN_API_KEY:
        required: false
      JIRA_USERNAME:
        required: false
      JIRA_API_KEY:
        required: false
      JIRA_BASE_URL:
        required: false
      CONFLUENCE_BASE_URL:
        required: false
      CONFLUENCE_SPACE:
        required: false

env:
  MAX_PARALLEL_USERS: 9  # Number of available test user credentials (1-9)

jobs:
  prepare:
    name: Prepare test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      env-name: ${{ steps.env.outputs.name }}
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ -n "${{ secrets.ELITEA_URL }}" ]; then
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            if [ "${{ inputs.environment }}" = "custom" ]; then
              ENV_NAME="${{ inputs.custom_environment }}"
              if [ -z "$ENV_NAME" ]; then
                echo "::error::custom_environment is required when environment=custom"
                exit 1
              fi
            else
              ENV_NAME="${{ inputs.environment }}"
            fi
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
          fi

      # Checkout only when suite=all to discover available suites from filesystem
      - name: Checkout for suite discovery
        if: inputs.suite == 'all' && inputs.custom_suites == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: automation/tests/ui
          sparse-checkout-cone-mode: false

      - name: Build test matrix
        id: build
        run: |
          MAX_USERS=${{ env.MAX_PARALLEL_USERS }}

          # Determine suite list
          if [ -n "${{ inputs.custom_suites }}" ]; then
            # Custom list provided - use as-is (no checkout needed)
            SUITES="${{ inputs.custom_suites }}"
            echo "Using custom suites: $SUITES"
          elif [ "${{ inputs.suite }}" = "all" ]; then
            # Discover from filesystem (checkout happened above)
            SUITES=$(ls -d automation/tests/ui/*/ 2>/dev/null \
              | xargs -n1 basename \
              | grep -v -E '^(__pycache__|__init__)' \
              | sort \
              | tr '\n' ',' \
              | sed 's/,$//')
            echo "Discovered suites from filesystem: $SUITES"
          else
            # Single suite selected (no checkout needed)
            SUITES="${{ inputs.suite }}"
            echo "Using single suite: $SUITES"
          fi

          if [ -z "$SUITES" ]; then
            echo "::error::No test suites found"
            exit 1
          fi

          # Convert to array
          IFS=',' read -ra SUITE_ARRAY <<< "$SUITES"
          SUITE_COUNT=${#SUITE_ARRAY[@]}
          echo "Total suites: $SUITE_COUNT"

          # Distribute suites across users (round-robin, max MAX_USERS jobs)
          # Each user_idx gets suites: idx, idx+MAX_USERS, idx+2*MAX_USERS, ...
          # This ensures max MAX_USERS parallel jobs, each with unique credentials
          declare -A USER_SUITES
          for i in "${!SUITE_ARRAY[@]}"; do
            suite="${SUITE_ARRAY[$i]}"
            user_idx=$(( (i % MAX_USERS) + 1 ))
            if [ -z "${USER_SUITES[$user_idx]}" ]; then
              USER_SUITES[$user_idx]="$suite"
            else
              USER_SUITES[$user_idx]="${USER_SUITES[$user_idx]},$suite"
            fi
          done

          # Build JSON matrix: one entry per user with their assigned suites
          JSON="["
          FIRST=true
          for user_idx in $(echo "${!USER_SUITES[@]}" | tr ' ' '\n' | sort -n); do
            suites="${USER_SUITES[$user_idx]}"
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              JSON="$JSON,"
            fi
            JSON="$JSON{\"user_idx\":\"$user_idx\",\"suites\":\"$suites\"}"
          done
          JSON="$JSON]"

          echo "Matrix JSON: $JSON"
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT

  test:
    name: ${{ inputs.environment }} - ${{ matrix.suites }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    outputs:
      env-name: ${{ needs.prepare.outputs.env-name }}
    steps:
      - name: Resolve environment (dispatch only)
        id: env
        run: |
          # For workflow_call, environment is passed directly
          # For workflow_dispatch, resolve from inputs
          if [ -n "${{ secrets.ELITEA_URL }}" ]; then
            # Called via workflow_call - secrets already resolved
            echo "mode=call" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # Called via workflow_dispatch - resolve secrets by env name
            echo "mode=dispatch" >> $GITHUB_OUTPUT
            if [ "${{ inputs.environment }}" = "custom" ]; then
              ENV_NAME="${{ inputs.custom_environment }}"
              if [ -z "$ENV_NAME" ]; then
                echo "::error::custom_environment is required when environment=custom"
                exit 1
              fi
            else
              ENV_NAME="${{ inputs.environment }}"
            fi
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
            echo "upper=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install pytest-rerunfailures
          pip install -e ".[reporting]"
          playwright install chromium
          # Note: playwright install-deps removed - GitHub-hosted runners have deps pre-installed.
          # This was causing 45+ minute hangs due to Azure apt mirror timeouts.

      - name: Install Allure CLI
        if: always()
        run: |
          curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz -C /opt
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run UI tests
        working-directory: automation
        env:
          HEADLESS: 'true'
          PLAYWRIGHT_TRACES: 'false'
          # Use secrets from workflow_call if available, otherwise resolve by env name
          ELITEA_URL: ${{ secrets.ELITEA_URL || secrets[format('ELITEA_URL_{0}', steps.env.outputs.upper)] }}
          ELITEA_API_BASE: ${{ secrets.ELITEA_API_BASE || secrets[format('ELITEA_API_BASE_{0}', steps.env.outputs.upper)] }}
          # Use indexed credentials for parallel execution (fall back to non-indexed for backwards compatibility)
          # Project IDs: TEST_USER_PROJECT_[ENV]_X passed as TEST_USER_PROJECT_X
          ELITEA_PROJECT_ID: ${{ secrets[format('TEST_USER_PROJECT_{0}', matrix.user_idx)] || secrets.ELITEA_PROJECT_ID }}
          # Tokens: TEST_USER_TOKEN_[ENV]_X passed as TEST_USER_TOKEN_X
          ELITEA_API_TOKEN: ${{ secrets[format('TEST_USER_TOKEN_{0}', matrix.user_idx)] || secrets.ELITEA_API_TOKEN }}
          TEST_USER_EMAIL: ${{ secrets[format('TEST_USER_NAME_{0}', matrix.user_idx)] || secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets[format('TEST_USER_PASSWORD_{0}', matrix.user_idx)] || secrets.TEST_USER_PASSWORD }}
          # Secondary user (User B) for multi-user tests - uses user 9 for all parallel jobs
          # Note: Job 9 will have same user for primary and secondary, but no multi-user tests there yet
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_NAME_9 }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_PASSWORD_9 }}
          # Team project ID for multi-user permission tests
          ELITEA_TEAM_PROJECT_ID: ${{ secrets.ELITEA_TEAM_PROJECT_ID }}
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          ZEPHYR_API_KEY: ${{ secrets.ZEPHYR_API_KEY }}
          ZEPHYR_ESENTIALS_KEY: ${{ secrets.ZEPHYR_ESENTIALS_KEY }}
          GITLAB_PRIVATE_TOKEN: ${{ secrets.GITLAB_PRIVATE_TOKEN }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_SPACE: ${{ secrets.CONFLUENCE_SPACE }}
          APP_PREFIX: '/app'
          CF_EXT_RATE: ${{ secrets.CF_EXT_RATE }}  # Rate limit bypass - repo secret, not passed from callers
        run: |
          PYTEST_CMD="pytest"

          # Each matrix job may run one or more suites (comma-separated)
          # Suites are run sequentially within the same job/session
          SUITES="${{ matrix.suites }}"
          TEST_PATHS=""
          IFS=',' read -ra SUITE_ARRAY <<< "$SUITES"
          for suite in "${SUITE_ARRAY[@]}"; do
            TEST_PATHS="$TEST_PATHS tests/ui/$suite/"
          done

          PYTEST_CMD="$PYTEST_CMD $TEST_PATHS"

          MARKERS="${{ inputs.markers }}"
          # "all" means no marker filtering (run all tests)
          if [ -n "$MARKERS" ] && [ "$MARKERS" != "all" ]; then
            PYTEST_CMD="$PYTEST_CMD -m \"$MARKERS\""
          fi

          PYTEST_CMD="$PYTEST_CMD -v --tb=short"

          echo "Running suites '$SUITES' with user index ${{ matrix.user_idx }}"
          echo "Running: $PYTEST_CMD"
          eval $PYTEST_CMD

      - name: Generate summary
        if: always()
        working-directory: automation
        run: |
          echo "## Test Results - ${{ steps.env.outputs.name }} - ${{ matrix.suites }}" >> $GITHUB_STEP_SUMMARY
          echo "**Suites:** ${{ matrix.suites }} (user index: ${{ matrix.user_idx }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "reports/junit.xml" ]; then
            TOTAL=$(grep -o 'tests="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            FAILURES=$(grep -o 'failures="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            ERRORS=$(grep -o 'errors="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            SKIPPED=$(grep -o 'skipped="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔥 Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              grep -A 3 'outcome="failed"\|outcome="error"' reports/junit.xml | grep 'classname\|name' | sed 's/.*name="\([^"]*\)".*/- `\1`/' >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Allure report
        if: always()
        working-directory: automation
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean || true

      - name: Set pages URL
        id: pages
        if: always()
        run: |
          URL="https://eliteaai.github.io/elitea-testing-public/${{ steps.env.outputs.name }}/${{ github.run_number }}/"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Report]($URL)" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        id: upload-results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.env.outputs.name }}-user${{ matrix.user_idx }}-${{ github.run_number }}
          path: |
            automation/reports/report.html
            automation/reports/junit.xml
            automation/reports/reruns.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure results (raw data for aggregation)
        if: always()
        id: upload-allure-results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.env.outputs.name }}-user${{ matrix.user_idx }}-${{ github.run_number }}
          path: automation/reports/allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report (generated HTML)
        if: always()
        id: upload-allure-report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.env.outputs.name }}-user${{ matrix.user_idx }}-${{ github.run_number }}
          path: automation/reports/allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Add artifact links to summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Test Results (JUnit XML + HTML Report)](${{ steps.upload-results.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Allure Report (download)](${{ steps.upload-allure-report.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ steps.env.outputs.name }}-user${{ matrix.user_idx }}-${{ github.run_number }}
          path: automation/reports/traces/*.zip
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish Allure report to GitHub Pages
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Install Allure CLI
        run: |
          curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz -C /opt
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-${{ needs.prepare.outputs.env-name }}-*-${{ github.run_number }}
          path: downloaded-results
          merge-multiple: false

      - name: Aggregate Allure results
        run: |
          # Collect all raw allure-results from downloaded suite artifacts
          mkdir -p aggregated-results

          echo "Downloaded artifacts:"
          ls -la downloaded-results/ || echo "No downloaded-results directory"

          # Each suite uploaded its raw allure-results (JSON files)
          for dir in downloaded-results/*/; do
            echo "Processing: $dir"
            if [ -d "$dir" ]; then
              cp -r "$dir"* aggregated-results/ 2>/dev/null || true
            fi
          done

          echo "Aggregated results:"
          ls -la aggregated-results/ | head -20

          # Generate combined report from raw results
          allure generate aggregated-results -o combined-report --clean || {
            echo "Warning: Allure generation failed"
            # Fallback: download and use one of the pre-generated HTML reports
            echo "Attempting fallback to pre-generated report..."
          }

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy report and prune old runs
        env:
          ENV_NAME: ${{ needs.prepare.outputs.env-name }}
          RUN_NUMBER: ${{ github.run_number }}
          KEEP_RUNS: 5
        run: |
          # Copy this run's allure-report into gh-pages/{env}/{run}/
          DEST="gh-pages/$ENV_NAME/$RUN_NUMBER"
          mkdir -p "$DEST"
          cp -r combined-report/. "$DEST/" 2>/dev/null || echo "Warning: No combined report to copy"

          # Prune: keep only the KEEP_RUNS most recent run directories
          if [ -d "gh-pages/$ENV_NAME" ]; then
            RUN_DIRS=$(ls -1 "gh-pages/$ENV_NAME" | grep -E '^[0-9]+$' | sort -n)
            COUNT=$(echo "$RUN_DIRS" | wc -l)
            if [ "$COUNT" -gt "$KEEP_RUNS" ]; then
              TO_DELETE=$(echo "$RUN_DIRS" | head -n $(( COUNT - KEEP_RUNS )))
              for d in $TO_DELETE; do
                rm -rf "gh-pages/$ENV_NAME/$d"
                echo "Deleted old run: $ENV_NAME/$d"
              done
            fi
          fi

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "report: ${{ needs.prepare.outputs.env-name }} run ${{ github.run_number }}"
          git push origin gh-pages

  publish-tms:
    name: Publish JUnit to OneTest TMS
    needs: [prepare, test]
    if: always() && inputs.publish_to_tms == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-${{ needs.prepare.outputs.env-name }}-*-${{ github.run_number }}
          path: results
          merge-multiple: false

      - name: Convert and push to TMS
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
        run: |
          # Generate run ID: RUN-ELITEA-YYYY-MM-DD-NNN-ENV-SUITE[-SUFFIX]-STATUS
          DATE=$(date +%Y-%m-%d)
          ENV_NAME="${{ needs.prepare.outputs.env-name }}"
          SUITE="${{ inputs.custom_suites != '' && inputs.custom_suites || inputs.suite }}"
          SUITE_UPPER=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]' | tr ',' '-')
          SUFFIX="${{ inputs.tms_report_suffix }}"

          # Aggregate all JUnit XML files from parallel suite runs
          # Convert JUnit XML to TMS JSON format and determine status
          # Merge rerun data from conftest.py's reruns.json (pytest-rerunfailures)
          python3 << 'EOF' > report.json
          import json, xml.etree.ElementTree as ET
          import glob
          import os

          items = []
          total = passed = failed = skipped = total_reruns = 0

          # Load reruns.json from conftest.py hook (pytest-rerunfailures data)
          # Format: {"nodeid": {"count": N, "messages": [...]}, ...}
          reruns_data = {}
          reruns_files = glob.glob("results/**/reruns.json", recursive=True)
          if not reruns_files:
              if os.path.exists("results/reruns.json"):
                  reruns_files = ["results/reruns.json"]
          for rf in reruns_files:
              try:
                  with open(rf) as f:
                      data = json.load(f)
                      reruns_data.update(data)
                      print(f"Loaded {len(data)} rerun entries from {rf}", file=__import__('sys').stderr)
              except Exception as e:
                  print(f"Warning: Failed to load {rf}: {e}", file=__import__('sys').stderr)

          # Find all junit.xml files from parallel suite runs
          junit_files = glob.glob("results/**/junit.xml", recursive=True)
          if not junit_files:
              # Fallback: try direct path (single suite)
              if os.path.exists("results/junit.xml"):
                  junit_files = ["results/junit.xml"]

          print(f"Found {len(junit_files)} JUnit files: {junit_files}", file=__import__('sys').stderr)

          for junit_file in junit_files:
              try:
                  root = ET.parse(junit_file).getroot()
                  for tc in root.iter("testcase"):
                      cls, name = tc.get("classname", ""), tc.get("name", "")
                      code_ref = f"{cls}.{name}" if cls else name
                      dur = int(float(tc.get("time", "0") or 0) * 1000)
                      f, e, sk = tc.find("failure"), tc.find("error"), tc.find("skipped")
                      if f is not None or e is not None:
                          el = f if f is not None else e
                          status = "failed"
                          msg = ((el.get("message") or "") + " " + (el.text or "")).strip()[:500]  # Truncate large tracebacks
                      elif sk is not None:
                          status, msg = "skipped", ""
                      else:
                          status, msg = "passed", ""

                      # Look up rerun data by nodeid (pytest format: path::Class::method)
                      # JUnit classname is dotted, need to construct nodeid
                      # classname: tests.ui.agents.test_agent.TestAgent
                      # name: test_method[param]
                      # nodeid: tests/ui/agents/test_agent.py::TestAgent::test_method[param]
                      nodeid = cls.replace(".", "/") + ".py::" + name.rsplit(".", 1)[-1] if cls else name
                      # Also try with :: between class and method
                      if "." in cls:
                          parts = cls.rsplit(".", 1)
                          nodeid_alt = parts[0].replace(".", "/") + ".py::" + parts[1] + "::" + name
                      else:
                          nodeid_alt = nodeid

                      rerun_info = reruns_data.get(nodeid) or reruns_data.get(nodeid_alt) or {"count": 0, "messages": []}
                      rerun_count = rerun_info.get("count", 0)
                      rerun_messages = rerun_info.get("messages", [])

                      total += 1
                      passed += status == "passed"
                      failed += status == "failed"
                      skipped += status == "skipped"
                      total_reruns += rerun_count
                      items.append({
                          "code_ref": code_ref,
                          "name": name,
                          "status": status,
                          "duration_ms": dur,
                          "failure_message": msg,
                          "reruns": rerun_count,
                          "rerun_messages": rerun_messages
                      })
              except Exception as e:
                  print(f"Warning: Failed to parse {junit_file}: {e}", file=__import__('sys').stderr)

          # Determine overall status: PASSED (all green), FAILED (any failed), AMBER (passed + skipped only)
          if failed > 0:
              overall_status = "FAILED"
          elif skipped > 0:
              overall_status = "AMBER"
          else:
              overall_status = "PASSED"

          out = {
              "launch": {"total": total, "passed": passed, "failed": failed, "skipped": skipped, "reruns": total_reruns},
              "items": items
          }
          print(json.dumps(out, indent=2, ensure_ascii=False))

          # Write status to a separate file for shell to read
          with open("status.txt", "w") as f:
              f.write(overall_status)
          EOF

          echo "✓ Generated report.json"
          cat report.json

          # Read the status determined by Python
          STATUS=$(cat status.txt)
          echo "Overall status: $STATUS"

          # Build RUN_ID with status suffix
          RUN_ID="RUN-ELITEA-${DATE}-${{ github.run_number }}-${ENV_NAME^^}-${SUITE_UPPER}"
          if [ -n "$SUFFIX" ]; then
            SUFFIX_UPPER=$(echo "$SUFFIX" | tr '[:lower:]' '[:upper:]')
            RUN_ID="${RUN_ID}-${SUFFIX_UPPER}"
          fi
          RUN_ID="${RUN_ID}-${STATUS}"
          FILENAME="junit-${RUN_ID}.json"

          # Push via GitHub API (no checkout required)
          CONTENT=$(base64 -w0 report.json)
          gh api repos/EliteaAI/onetest-ai-tm-Elitea/contents/reports/automated/${FILENAME} \
            -X PUT \
            -f message="results: ingest ${RUN_ID}" \
            -f content="${CONTENT}" \
            -f branch="main"

          echo "✓ Pushed to EliteaAI/onetest-ai-tm-Elitea/reports/automated/${FILENAME}"

      - name: Checkout TMS repo
        if: always() && inputs.update_correlation == true
        uses: actions/checkout@v4
        with:
          repository: EliteaAI/onetest-ai-tm-Elitea
          token: ${{ secrets.GIT_HUB_TOKEN }}
          path: tms

      - name: Run correlation and coverage
        if: always() && inputs.update_correlation == true
        run: |
          DATE=$(date +%Y-%m-%d)
          ENV_NAME="${{ needs.test.outputs.env-name }}"
          SUITE="${{ inputs.custom_suites != '' && inputs.custom_suites || inputs.suite }}"
          SUITE_UPPER=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]' | tr ',' '-')
          SUFFIX="${{ inputs.tms_report_suffix }}"
          STATUS=$(cat status.txt)

          RUN_ID="RUN-ELITEA-${DATE}-${{ github.run_number }}-${ENV_NAME^^}-${SUITE_UPPER}"
          if [ -n "$SUFFIX" ]; then
            RUN_ID="${RUN_ID}-$(echo "$SUFFIX" | tr '[:lower:]' '[:upper:]')"
          fi
          RUN_ID="${RUN_ID}-${STATUS}"

          cd tms
          bash onetest-tms/scripts/correlate-results.sh \
            --automated "reports/automated/junit-${RUN_ID}.json"
          bash onetest-tms/scripts/automation-coverage.sh

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/correlation.json reports/coverage.md
          git diff --cached --quiet || \
            git commit -m "correlation: rebuild for ${RUN_ID}"
          git push

      - name: Generate test dashboard
        if: always() && inputs.update_correlation == true
        run: |
          # Build RUN_ID (same logic as correlation step)
          DATE=$(date +%Y-%m-%d)
          ENV_NAME="${{ needs.test.outputs.env-name }}"
          SUITE="${{ inputs.custom_suites != '' && inputs.custom_suites || inputs.suite }}"
          SUITE_UPPER=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]' | tr ',' '-')
          SUFFIX="${{ inputs.tms_report_suffix }}"
          STATUS=$(cat status.txt)
          RUN_ID="RUN-ELITEA-${DATE}-${{ github.run_number }}-${ENV_NAME^^}-${SUITE_UPPER}"
          if [ -n "$SUFFIX" ]; then
            RUN_ID="${RUN_ID}-$(echo "$SUFFIX" | tr '[:lower:]' '[:upper:]')"
          fi
          RUN_ID="${RUN_ID}-${STATUS}"
          echo "RUN_ID=${RUN_ID}"

          cd tms

          # Generate dashboard.md with Mermaid charts from junit-RUN-*.json files
          python3 << 'DASHBOARD_EOF' > reports/dashboard.md
          import json
          import glob
          import os
          from datetime import datetime, timezone

          # Load all junit reports (last 20 for trend)
          reports = []
          excluded = []
          all_files = sorted(glob.glob("reports/automated/junit-RUN-*.json"))[-20:]
          for f in all_files:
              try:
                  with open(f) as fp:
                      data = json.load(fp)
                      # Extract run name from filename: junit-RUN-ELITEA-2026-08-20-123-DEV-SMOKE-PASSED.json
                      name = os.path.basename(f).replace("junit-", "").replace(".json", "")
                      # Shorten: RUN-ELITEA-2026-08-20-123-DEV-SMOKE-PASSED -> Aug20-123-DEV
                      parts = name.split("-")
                      if len(parts) >= 7:
                          month = datetime.strptime(parts[3], "%Y").strftime("%b") if len(parts[3]) == 4 else parts[3]
                          try:
                              month = datetime.strptime(f"{parts[3]}-{parts[4]}-{parts[5]}", "%Y-%m-%d").strftime("%b%d")
                          except:
                              month = f"{parts[4]}-{parts[5]}"
                          short_name = f"{month}-{parts[6]}-{parts[7]}"
                      else:
                          short_name = name[:15]

                      launch = data.get("launch", {})
                      entry = {
                          "name": short_name,
                          "full_name": name,
                          "total": launch.get("total", 0),
                          "passed": launch.get("passed", 0),
                          "failed": launch.get("failed", 0),
                          "skipped": launch.get("skipped", 0),
                          "reruns": launch.get("reruns", 0),
                          "file": os.path.basename(f)
                      }
                      # Validate numeric fields are integers (skip report if not)
                      for field in ("total", "passed", "failed", "skipped", "reruns"):
                          if not isinstance(entry[field], int):
                              raise TypeError(f"Field '{field}' must be int, got {type(entry[field]).__name__}")
                      reports.append(entry)
              except Exception as e:
                  excluded.append((os.path.basename(f), str(e)))

          # Print statistics
          import sys
          print(f"Files available: {len(all_files)}, included: {len(reports)}, excluded: {len(excluded)}", file=sys.stderr)
          for fname, reason in excluded:
              print(f"  - {fname}: {reason}", file=sys.stderr)

          if not reports:
              print("# Test Dashboard\n\nNo test reports found yet.")
              exit(0)

          # Header
          print("# Test Dashboard")
          print(f"\n_Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}_\n")

          # Latest run pie chart
          latest = reports[-1]
          print("## Latest Run\n")
          print(f"**{latest['full_name']}**\n")
          print("```mermaid")
          print("pie showData")
          print(f'    title "Test Results ({latest["total"]} total)"')
          print(f'    "Passed" : {latest["passed"]}')
          print(f'    "Failed" : {latest["failed"]}')
          if latest["skipped"] > 0:
              print(f'    "Skipped" : {latest["skipped"]}')
          print("```\n")

          # Stats table for latest
          print("| Metric | Value |")
          print("|--------|-------|")
          print(f"| Total | {latest['total']} |")
          print(f"| Passed | {latest['passed']} |")
          print(f"| Failed | {latest['failed']} |")
          print(f"| Skipped | {latest['skipped']} |")
          print(f"| Reruns | {latest['reruns']} |")
          pass_rate = (latest['passed'] / latest['total'] * 100) if latest['total'] > 0 else 0
          print(f"| Pass Rate | {pass_rate:.1f}% |")
          print()

          # Trend chart (last 10 runs)
          trend_runs = reports[-10:]
          if len(trend_runs) > 1:
              print("## Trend (Last 10 Runs)\n")
              names = [r['name'] for r in trend_runs]
              passed = [r['passed'] for r in trend_runs]
              failed = [r['failed'] for r in trend_runs]
              max_val = max(max(passed), 10) + 5

              print("```mermaid")
              print("xychart-beta")
              print('    title "Pass/Fail Trend"')
              print(f'    x-axis [{", ".join(names)}]')
              print(f'    y-axis "Tests" 0 --> {max_val}')
              print(f'    bar "Passed" [{", ".join(map(str, passed))}]')
              print(f'    bar "Failed" [{", ".join(map(str, failed))}]')
              print("```\n")

              # Reruns trend if any
              reruns = [r['reruns'] for r in trend_runs]
              if any(r > 0 for r in reruns):
                  print("### Reruns Trend\n")
                  print("```mermaid")
                  print("xychart-beta")
                  print('    title "Test Reruns (Flakiness Indicator)"')
                  print(f'    x-axis [{", ".join(names)}]')
                  print(f'    y-axis "Reruns" 0 --> {max(reruns) + 3}')
                  print(f'    line "Reruns" [{", ".join(map(str, reruns))}]')
                  print("```\n")

          # History table
          print("## Run History\n")
          print("| Run | Total | Passed | Failed | Skipped | Reruns | Rate |")
          print("|-----|-------|--------|--------|---------|--------|------|")
          for r in reversed(reports[-10:]):
              rate = (r['passed'] / r['total'] * 100) if r['total'] > 0 else 0
              status = "✅" if r['failed'] == 0 else "❌"
              print(f"| {status} {r['name']} | {r['total']} | {r['passed']} | {r['failed']} | {r['skipped']} | {r['reruns']} | {rate:.0f}% |")
          print()

          print("---")
          print(f"_Source: `reports/automated/junit-RUN-*.json` ({len(reports)} reports)_")
          DASHBOARD_EOF

          echo "✓ Generated reports/dashboard.md"
          cat reports/dashboard.md

          # Generate coverage analysis comparing automation/index.json with TMS index_automated.json
          # Fetch automation index from main repo (not checked out in this job)
          curl -sL -H "Authorization: token ${{ secrets.GIT_HUB_TOKEN }}" \
            "https://raw.githubusercontent.com/EliteaAI/elitea-testing-public/main/automation/index.json" \
            -o /tmp/automation_index.json || echo '{"tests":[]}' > /tmp/automation_index.json

          python3 << 'COVERAGE_EOF' >> reports/dashboard.md
          import json
          import os

          print("\n---\n")
          print("## TMS Coverage Analysis\n")

          # Load automation index (fetched from elitea-testing-public repo)
          automation_index_path = "/tmp/automation_index.json"
          tms_index_path = "index_automated.json"

          if not os.path.exists(automation_index_path):
              print("_Automation index not found. Run `build-test-index` workflow first._")
              exit(0)

          if not os.path.exists(tms_index_path):
              print("_TMS index not found._")
              exit(0)

          with open(automation_index_path) as f:
              automation_data = json.load(f)
          with open(tms_index_path) as f:
              tms_data = json.load(f)

          # Extract test IDs
          automation_ids = set(t["automation_test_id"] for t in automation_data.get("tests", []))

          # TMS cases have automation_test_id as a list
          tms_ids = set()
          tms_case_map = {}  # test_id -> case info
          for case in tms_data.get("cases", []):
              for test_id in case.get("automation_test_id", []):
                  tms_ids.add(test_id)
                  tms_case_map[test_id] = {"id": case["id"], "title": case["title"], "status": case.get("status", "")}

          # Calculate differences
          in_automation_not_tms = automation_ids - tms_ids  # Tests without TMS cases
          in_tms_not_automation = tms_ids - automation_ids  # Orphan TMS refs (case exists but test doesn't)
          linked = automation_ids & tms_ids  # Properly linked

          # Summary stats
          print("| Metric | Count |")
          print("|--------|-------|")
          print(f"| Tests in automation | {len(automation_ids)} |")
          print(f"| Tests linked to TMS cases | {len(linked)} |")
          print(f"| Tests without TMS case | {len(in_automation_not_tms)} |")
          print(f"| Orphan TMS refs (test missing) | {len(in_tms_not_automation)} |")
          coverage = len(linked) / len(automation_ids) * 100 if automation_ids else 0
          print(f"| **TMS Coverage** | **{coverage:.1f}%** |")
          print()

          # Coverage pie chart
          print("```mermaid")
          print("pie showData")
          print(f'    title "TMS Linkage ({len(automation_ids)} tests)"')
          print(f'    "Linked to TMS" : {len(linked)}')
          print(f'    "No TMS case" : {len(in_automation_not_tms)}')
          print("```\n")

          # Tests without TMS cases (show top 15)
          if in_automation_not_tms:
              print("### Tests Without TMS Case\n")
              print("_Tests that exist in automation but have no linked TMS case._\n")
              print("<details>")
              print(f"<summary>Show {len(in_automation_not_tms)} unlinked tests</summary>\n")
              for test_id in sorted(in_automation_not_tms)[:50]:
                  # Shorten for display
                  short = test_id.replace("tests.ui.", "").replace("tests.api.", "api/")
                  print(f"- `{short}`")
              if len(in_automation_not_tms) > 50:
                  print(f"- _... and {len(in_automation_not_tms) - 50} more_")
              print("\n</details>\n")

          # Orphan TMS refs (show top 15)
          if in_tms_not_automation:
              print("### Orphan TMS References\n")
              print("_TMS cases reference tests that don't exist in automation (renamed/deleted?)._\n")
              print("<details>")
              print(f"<summary>Show {len(in_tms_not_automation)} orphan refs</summary>\n")
              for test_id in sorted(in_tms_not_automation)[:50]:
                  case = tms_case_map.get(test_id, {})
                  case_id = case.get("id", "?")
                  short = test_id.replace("tests.ui.", "").replace("tests.api.", "api/")
                  print(f"- `{short}` ({case_id})")
              if len(in_tms_not_automation) > 50:
                  print(f"- _... and {len(in_tms_not_automation) - 50} more_")
              print("\n</details>\n")

          print("---")
          print(f"_Compared `automation/index.json` ({len(automation_ids)} tests) with `index_automated.json` ({len(tms_ids)} refs)_")
          COVERAGE_EOF

          echo "✓ Appended TMS coverage analysis"

          # Generate JSON dashboard snapshot for historical tracking
          RUN_ID="${RUN_ID}"  # From outer shell
          python3 << SNAPSHOT_EOF > "reports/automated/dashboard-${RUN_ID}.json"
          import json
          import glob
          import os
          from datetime import datetime, timezone

          # Load latest junit report
          all_files = sorted(glob.glob("reports/automated/junit-RUN-*.json"))
          latest_file = all_files[-1] if all_files else None

          latest_run = {}
          if latest_file:
              with open(latest_file) as f:
                  data = json.load(f)
                  launch = data.get("launch", {})
                  latest_run = {
                      "file": os.path.basename(latest_file),
                      "total": launch.get("total", 0),
                      "passed": launch.get("passed", 0),
                      "failed": launch.get("failed", 0),
                      "skipped": launch.get("skipped", 0),
                      "reruns": launch.get("reruns", 0),
                      "pass_rate": round(launch.get("passed", 0) / launch.get("total", 1) * 100, 1)
                  }

          # Load TMS coverage data
          automation_index_path = "/tmp/automation_index.json"
          tms_index_path = "index_automated.json"

          tms_coverage = {}
          if os.path.exists(automation_index_path) and os.path.exists(tms_index_path):
              with open(automation_index_path) as f:
                  automation_data = json.load(f)
              with open(tms_index_path) as f:
                  tms_data = json.load(f)

              automation_ids = set(t["automation_test_id"] for t in automation_data.get("tests", []))
              tms_ids = set()
              for case in tms_data.get("cases", []):
                  for test_id in case.get("automation_test_id", []):
                      tms_ids.add(test_id)

              linked = automation_ids & tms_ids
              coverage = round(len(linked) / len(automation_ids) * 100, 1) if automation_ids else 0

              tms_coverage = {
                  "automation_tests": len(automation_ids),
                  "tms_refs": len(tms_ids),
                  "linked": len(linked),
                  "tests_without_tms": len(automation_ids - tms_ids),
                  "orphan_tms_refs": len(tms_ids - automation_ids),
                  "coverage_pct": coverage
              }

          snapshot = {
              "run_id": "${RUN_ID}",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "latest_run": latest_run,
              "tms_coverage": tms_coverage
          }

          print(json.dumps(snapshot, indent=2))
          SNAPSHOT_EOF

          echo "✓ Generated reports/automated/dashboard-${RUN_ID}.json"

          git add reports/dashboard.md "reports/automated/dashboard-${RUN_ID}.json"
          git diff --cached --quiet || \
            git commit -m "dashboard: update test metrics for ${RUN_ID}"
          git push
