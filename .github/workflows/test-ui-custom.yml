name: UI Tests CUSTOM
run-name: UI Tests ${{ inputs.environment || 'CUSTOM' }} [${{ inputs.ref || github.ref_name }}] [${{ inputs.custom_suites || inputs.suite || 'all' }}]

# Base workflow for UI tests - can be called directly or by environment workflows
#
# Usage:
#   1. Manual: Run with full parameter control via workflow_dispatch
#   2. Called: Environment workflows (dev/stage2/next) call this via workflow_call

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - stage2
          - next
          - custom
        default: dev
      custom_environment:
        description: 'Custom environment name (only when environment=custom)'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - all
          - agents
          - admin
          - artifacts
          - chat
          - pipelines
          - skills
          - smoke
          - support_assistant
          - toolkits
          - voice
        default: all
      custom_suites:
        description: 'Custom suites (comma-separated, e.g., "chat,agents")'
        required: false
        type: string
        default: ''
      markers:
        description: 'Pytest markers (e.g., p0, smoke, "p0 or p1")'
        required: false
        default: ''
      ref:
        description: 'Git ref (branch, tag, SHA). Leave empty for default.'
        required: false
        type: string
        default: ''
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        required: false
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name (e.g., "scheduled", "nightly") (e.g., "scheduled", "nightly")'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      suite:
        description: 'Test suite to run'
        required: false
        type: string
        default: 'all'
      custom_suites:
        description: 'Custom suites (comma-separated, e.g., "agents,chat,pipelines")'
        required: false
        type: string
        default: ''
      markers:
        description: 'Pytest markers'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref (branch, tag, SHA)'
        required: false
        type: string
        default: ''
      publish_to_tms:
        description: 'Publish results to OneTest TMS'
        required: false
        type: boolean
        default: false
      tms_report_suffix:
        description: 'Suffix for TMS report name (e.g., "scheduled", "nightly")'
        required: false
        type: string
        default: ''
    secrets:
      ELITEA_URL:
        required: true
      ELITEA_API_BASE:
        required: true
      ELITEA_API_TOKEN:
        required: true
      ELITEA_PROJECT_ID:
        required: true
      TEST_USER_EMAIL:
        required: false
      TEST_USER_PASSWORD:
        required: false
      TEST_USER_EMAIL_1:
        required: false
      TEST_USER_PASSWORD_1:
        required: false
      TEST_USER_EMAIL_2:
        required: false
      TEST_USER_PASSWORD_2:
        required: false
      TEST_USER_EMAIL_3:
        required: false
      TEST_USER_PASSWORD_3:
        required: false
      TEST_USER_EMAIL_4:
        required: false
      TEST_USER_PASSWORD_4:
        required: false
      TEST_USER_EMAIL_5:
        required: false
      TEST_USER_PASSWORD_5:
        required: false
      TEST_USER_EMAIL_6:
        required: false
      TEST_USER_PASSWORD_6:
        required: false
      TEST_USER_EMAIL_7:
        required: false
      TEST_USER_PASSWORD_7:
        required: false
      TEST_USER_EMAIL_8:
        required: false
      TEST_USER_PASSWORD_8:
        required: false
      TEST_USER_EMAIL_9:
        required: false
      TEST_USER_PASSWORD_9:
        required: false
      TEST_USER_EMAIL_10:
        required: false
      TEST_USER_PASSWORD_10:
        required: false
      GIT_HUB_TOKEN:
        required: false
      BITBUCKET_TOKEN:
        required: false
      ADO_TOKEN:
        required: false
      CONFLUENCE_USERNAME:
        required: false
      CONFLUENCE_API_KEY:
        required: false
      XRAY_CLIENT_ID:
        required: false
      XRAY_CLIENT_SECRET:
        required: false
      ZEPHYR_API_KEY:
        required: false
      ZEPHYR_ESENTIALS_KEY:
        required: false
      GITLAB_PRIVATE_TOKEN:
        required: false
      POSTMAN_API_KEY:
        required: false
      JIRA_USERNAME:
        required: false
      JIRA_API_KEY:
        required: false
      JIRA_BASE_URL:
        required: false
      CONFLUENCE_BASE_URL:
        required: false
      CONFLUENCE_SPACE:
        required: false

jobs:
  prepare:
    name: Prepare test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      env-name: ${{ steps.env.outputs.name }}
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ -n "${{ secrets.ELITEA_URL }}" ]; then
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            if [ "${{ inputs.environment }}" = "custom" ]; then
              ENV_NAME="${{ inputs.custom_environment }}"
              if [ -z "$ENV_NAME" ]; then
                echo "::error::custom_environment is required when environment=custom"
                exit 1
              fi
            else
              ENV_NAME="${{ inputs.environment }}"
            fi
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build test matrix
        id: build
        run: |
          # All available suites with their fixed user indices
          # agents=1, admin=2, artifacts=3, chat=4, pipelines=5,
          # skills=6, smoke=7, support_assistant=8, toolkits=9, voice=10
          ALL_SUITES="agents,admin,artifacts,chat,pipelines,skills,smoke,support_assistant,toolkits,voice"

          # Determine selected suites
          if [ -n "${{ inputs.custom_suites }}" ]; then
            SELECTED="${{ inputs.custom_suites }}"
          elif [ "${{ inputs.suite }}" = "all" ]; then
            SELECTED="$ALL_SUITES"
          else
            SELECTED="${{ inputs.suite }}"
          fi

          echo "Selected suites: $SELECTED"

          # Build JSON matrix with suite name and user index
          # Use jq for reliable JSON generation, compact output for GITHUB_OUTPUT
          JSON=$(echo "$SELECTED" | tr ',' '\n' | while read -r s; do
            s=$(echo "$s" | xargs)  # trim whitespace
            if [ -z "$s" ]; then continue; fi

            # Get 1-based index from ALL_SUITES list
            IDX=$(echo "$ALL_SUITES" | tr ',' '\n' | grep -n "^${s}$" | cut -d: -f1)

            if [ -z "$IDX" ]; then
              echo "::warning::Unknown suite '$s', using user index 1" >&2
              IDX=1
            fi

            echo "{\"suite\":\"$s\",\"user_idx\":\"$IDX\"}"
          done | jq -sc '.')

          echo "Matrix JSON: $JSON"
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT

  test:
    name: ${{ inputs.environment }} - ${{ matrix.suite }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    outputs:
      env-name: ${{ needs.prepare.outputs.env-name }}
    steps:
      - name: Resolve environment (dispatch only)
        id: env
        run: |
          # For workflow_call, environment is passed directly
          # For workflow_dispatch, resolve from inputs
          if [ -n "${{ secrets.ELITEA_URL }}" ]; then
            # Called via workflow_call - secrets already resolved
            echo "mode=call" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # Called via workflow_dispatch - resolve secrets by env name
            echo "mode=dispatch" >> $GITHUB_OUTPUT
            if [ "${{ inputs.environment }}" = "custom" ]; then
              ENV_NAME="${{ inputs.custom_environment }}"
              if [ -z "$ENV_NAME" ]; then
                echo "::error::custom_environment is required when environment=custom"
                exit 1
              fi
            else
              ENV_NAME="${{ inputs.environment }}"
            fi
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
            echo "upper=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-rerunfailures
          pip install -e ".[reporting]"
          playwright install chromium
          playwright install-deps chromium

      - name: Install Allure CLI
        if: always()
        run: |
          curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz -C /opt
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run UI tests
        working-directory: automation
        env:
          HEADLESS: 'true'
          PLAYWRIGHT_TRACES: 'false'
          # Use secrets from workflow_call if available, otherwise resolve by env name
          ELITEA_URL: ${{ secrets.ELITEA_URL || secrets[format('ELITEA_URL_{0}', steps.env.outputs.upper)] }}
          ELITEA_API_BASE: ${{ secrets.ELITEA_API_BASE || secrets[format('ELITEA_API_BASE_{0}', steps.env.outputs.upper)] }}
          ELITEA_API_TOKEN: ${{ secrets.ELITEA_API_TOKEN || secrets[format('ELITEA_API_TOKEN_{0}', steps.env.outputs.upper)] }}
          ELITEA_PROJECT_ID: ${{ secrets.ELITEA_PROJECT_ID || secrets[format('ELITEA_PROJECT_ID_{0}', steps.env.outputs.upper)] }}
          # Use indexed user credentials for parallel execution (fall back to non-indexed for backwards compatibility)
          TEST_USER_EMAIL: ${{ secrets[format('TEST_USER_EMAIL_{0}', matrix.user_idx)] || secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets[format('TEST_USER_PASSWORD_{0}', matrix.user_idx)] || secrets.TEST_USER_PASSWORD }}
          GIT_HUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          ZEPHYR_API_KEY: ${{ secrets.ZEPHYR_API_KEY }}
          ZEPHYR_ESENTIALS_KEY: ${{ secrets.ZEPHYR_ESENTIALS_KEY }}
          GITLAB_PRIVATE_TOKEN: ${{ secrets.GITLAB_PRIVATE_TOKEN }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_SPACE: ${{ secrets.CONFLUENCE_SPACE }}
          APP_PREFIX: '/app'
          CF_EXT_RATE: ${{ secrets.CF_EXT_RATE }}  # Rate limit bypass - repo secret, not passed from callers
        run: |
          PYTEST_CMD="pytest"

          # Each matrix job runs a single suite
          SUITE="${{ matrix.suite }}"
          TEST_PATHS="tests/ui/$SUITE/"

          PYTEST_CMD="$PYTEST_CMD $TEST_PATHS"

          MARKERS="${{ inputs.markers }}"
          if [ -n "$MARKERS" ]; then
            PYTEST_CMD="$PYTEST_CMD -m \"$MARKERS\""
          fi

          PYTEST_CMD="$PYTEST_CMD -v --tb=short"

          echo "Running suite '$SUITE' with user index ${{ matrix.user_idx }}"
          echo "Running: $PYTEST_CMD"
          eval $PYTEST_CMD

      - name: Generate summary
        if: always()
        working-directory: automation
        run: |
          echo "## Test Results - ${{ steps.env.outputs.name }} - ${{ matrix.suite }}" >> $GITHUB_STEP_SUMMARY
          echo "**Suite:** ${{ matrix.suite }} (user index: ${{ matrix.user_idx }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "reports/junit.xml" ]; then
            TOTAL=$(grep -o 'tests="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            FAILURES=$(grep -o 'failures="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            ERRORS=$(grep -o 'errors="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            SKIPPED=$(grep -o 'skipped="[0-9]*"' reports/junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔥 Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              grep -A 3 'outcome="failed"\|outcome="error"' reports/junit.xml | grep 'classname\|name' | sed 's/.*name="\([^"]*\)".*/- `\1`/' >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Allure report
        if: always()
        working-directory: automation
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean || true

      - name: Set pages URL
        id: pages
        if: always()
        run: |
          URL="https://eliteaai.github.io/elitea-testing-public/${{ steps.env.outputs.name }}/${{ github.run_number }}/"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Report]($URL)" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        id: upload-results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.env.outputs.name }}-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            automation/reports/report.html
            automation/reports/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        id: upload-allure-report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.env.outputs.name }}-${{ matrix.suite }}-${{ github.run_number }}
          path: automation/reports/allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Add artifact links to summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Test Results (JUnit XML + HTML Report)](${{ steps.upload-results.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Allure Report (download)](${{ steps.upload-allure-report.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ steps.env.outputs.name }}-${{ matrix.suite }}-${{ github.run_number }}
          path: automation/reports/traces/*.zip
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish Allure report to GitHub Pages
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Install Allure CLI
        run: |
          curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz -C /opt
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-report-${{ needs.prepare.outputs.env-name }}-*-${{ github.run_number }}
          path: downloaded-reports
          merge-multiple: false

      - name: Aggregate Allure reports
        run: |
          # Collect all allure-results from downloaded suite reports
          mkdir -p aggregated-results

          # Each suite uploaded its allure-report (generated HTML), but we need the raw results
          # The allure-report contains data/ folder with results
          for dir in downloaded-reports/*/; do
            if [ -d "$dir/data" ]; then
              cp -r "$dir/data/"* aggregated-results/ 2>/dev/null || true
            fi
            # Also check for allure-results structure
            if [ -d "$dir/allure-results" ]; then
              cp -r "$dir/allure-results/"* aggregated-results/ 2>/dev/null || true
            fi
          done

          # Generate combined report
          allure generate aggregated-results -o combined-report --clean || {
            echo "Warning: Allure generation failed, copying first available report"
            FIRST_REPORT=$(ls -d downloaded-reports/*/ 2>/dev/null | head -1)
            if [ -n "$FIRST_REPORT" ]; then
              cp -r "$FIRST_REPORT" combined-report/
            fi
          }

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy report and prune old runs
        env:
          ENV_NAME: ${{ needs.prepare.outputs.env-name }}
          RUN_NUMBER: ${{ github.run_number }}
          KEEP_RUNS: 5
        run: |
          # Copy this run's allure-report into gh-pages/{env}/{run}/
          DEST="gh-pages/$ENV_NAME/$RUN_NUMBER"
          mkdir -p "$DEST"
          cp -r combined-report/. "$DEST/" 2>/dev/null || echo "Warning: No combined report to copy"

          # Prune: keep only the KEEP_RUNS most recent run directories
          if [ -d "gh-pages/$ENV_NAME" ]; then
            RUN_DIRS=$(ls -1 "gh-pages/$ENV_NAME" | grep -E '^[0-9]+$' | sort -n)
            COUNT=$(echo "$RUN_DIRS" | wc -l)
            if [ "$COUNT" -gt "$KEEP_RUNS" ]; then
              TO_DELETE=$(echo "$RUN_DIRS" | head -n $(( COUNT - KEEP_RUNS )))
              for d in $TO_DELETE; do
                rm -rf "gh-pages/$ENV_NAME/$d"
                echo "Deleted old run: $ENV_NAME/$d"
              done
            fi
          fi

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "report: ${{ needs.prepare.outputs.env-name }} run ${{ github.run_number }}"
          git push origin gh-pages

  publish-tms:
    name: Publish JUnit to OneTest TMS
    needs: [prepare, test]
    if: always() && inputs.publish_to_tms == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-${{ needs.prepare.outputs.env-name }}-*-${{ github.run_number }}
          path: results
          merge-multiple: false

      - name: Convert and push to TMS
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}
        run: |
          # Generate run ID: RUN-ELITEA-YYYY-MM-DD-NNN-ENV-SUITE[-SUFFIX]-STATUS
          DATE=$(date +%Y-%m-%d)
          ENV_NAME="${{ needs.prepare.outputs.env-name }}"
          SUITE="${{ inputs.custom_suites != '' && inputs.custom_suites || inputs.suite }}"
          SUITE_UPPER=$(echo "$SUITE" | tr '[:lower:]' '[:upper:]' | tr ',' '-')
          SUFFIX="${{ inputs.tms_report_suffix }}"

          # Aggregate all JUnit XML files from parallel suite runs
          # Convert JUnit XML to TMS JSON format and determine status
          python3 << 'EOF' > report.json
          import json, xml.etree.ElementTree as ET
          import glob
          import os

          items = []
          total = passed = failed = skipped = 0

          # Find all junit.xml files from parallel suite runs
          junit_files = glob.glob("results/**/junit.xml", recursive=True)
          if not junit_files:
              # Fallback: try direct path (single suite)
              if os.path.exists("results/junit.xml"):
                  junit_files = ["results/junit.xml"]

          print(f"Found {len(junit_files)} JUnit files: {junit_files}", file=__import__('sys').stderr)

          for junit_file in junit_files:
              try:
                  root = ET.parse(junit_file).getroot()
                  for tc in root.iter("testcase"):
                      cls, name = tc.get("classname", ""), tc.get("name", "")
                      code_ref = f"{cls}.{name}" if cls else name
                      dur = int(float(tc.get("time", "0") or 0) * 1000)
                      f, e, sk = tc.find("failure"), tc.find("error"), tc.find("skipped")
                      if f is not None or e is not None:
                          el = f if f is not None else e
                          status = "failed"
                          msg = ((el.get("message") or "") + " " + (el.text or "")).strip()
                      elif sk is not None:
                          status, msg = "skipped", ""
                      else:
                          status, msg = "passed", ""
                      total += 1
                      passed += status == "passed"
                      failed += status == "failed"
                      skipped += status == "skipped"
                      items.append({
                          "code_ref": code_ref,
                          "name": name,
                          "status": status,
                          "duration_ms": dur,
                          "failure_message": msg
                      })
              except Exception as e:
                  print(f"Warning: Failed to parse {junit_file}: {e}", file=__import__('sys').stderr)

          # Determine overall status: PASSED (all green), FAILED (any failed), AMBER (passed + skipped only)
          if failed > 0:
              overall_status = "FAILED"
          elif skipped > 0:
              overall_status = "AMBER"
          else:
              overall_status = "PASSED"

          out = {
              "launch": {"total": total, "passed": passed, "failed": failed, "skipped": skipped},
              "items": items
          }
          print(json.dumps(out, indent=2, ensure_ascii=False))

          # Write status to a separate file for shell to read
          with open("status.txt", "w") as f:
              f.write(overall_status)
          EOF

          echo "✓ Generated report.json"
          cat report.json

          # Read the status determined by Python
          STATUS=$(cat status.txt)
          echo "Overall status: $STATUS"

          # Build RUN_ID with status suffix
          RUN_ID="RUN-ELITEA-${DATE}-${{ github.run_number }}-${ENV_NAME^^}-${SUITE_UPPER}"
          if [ -n "$SUFFIX" ]; then
            SUFFIX_UPPER=$(echo "$SUFFIX" | tr '[:lower:]' '[:upper:]')
            RUN_ID="${RUN_ID}-${SUFFIX_UPPER}"
          fi
          RUN_ID="${RUN_ID}-${STATUS}"
          FILENAME="junit-${RUN_ID}.json"

          # Push via GitHub API (no checkout required)
          CONTENT=$(base64 -w0 report.json)
          gh api repos/EliteaAI/onetest-ai-tm-Elitea/contents/reports/automated/${FILENAME} \
            -X PUT \
            -f message="results: ingest ${RUN_ID}" \
            -f content="${CONTENT}" \
            -f branch="main"

          echo "✓ Pushed to EliteaAI/onetest-ai-tm-Elitea/reports/automated/${FILENAME}"
