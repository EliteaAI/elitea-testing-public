    value: ''
  files_json:
    type: str
    value: '[]'
  total_files:
    type: str
    value: '0'
  current_index:
    type: str
    value: '0'
  cur_id:
    type: str
    value: ''
  cur_title:
    type: str
    value: ''
  cur_status:
    type: str
    value: ''
  cur_path:
