entry_point: START

state:
  input:
    type: str
  messages:
    type: list
  start:
    type: str
    value: ''
  project_items:
    type: str
    value: '[]'
  milestone_issues:
    type: str
    value: '[]'
  verified_tickets:
    type: str
    value: '[]'
  current_ticket_index:
    type: str
    value: '0'
  total_tickets:
    type: str
    value: '0'
  current_ticket:
    type: str
    value: '{}'
  processed_result:
    type: str
    value: ''
  issue_title:
    type: str
    value: ''
  issue_body:
    type: str
    value: ''
  created_issues:
    type: str
    value: '[]'

nodes:
  - id: START
    type: code
    code:
      type: fixed
      value: |
        {'start': 'Pipeline started'}
    input: []
    output:
      - start
    structured_output: true
    transition: FetchProjectItems

  # Step 1: Fetch items with "Verified on DEV Env" status from project board
  - id: FetchProjectItems
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: search_project_issues
    input: []
    input_mapping:
      board_repo:
        type: fixed
        value: EliteaAI/elitea_issues
      project_number:
        type: fixed
        value: 1
      search_query:
        type: fixed
        value: 'status:"Verified on DEV Env"'
      items_count:
        type: fixed
        value: 100
    output:
      - project_items
    structured_output: true
    transition: FetchMilestoneIssues

  # Step 2: Fetch issues with milestone R-2.0.7
  - id: FetchMilestoneIssues
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: search_issues
    input: []
    input_mapping:
      search_query:
        type: fixed
        value: 'milestone:"R-2.0.7" state:open'
      repo_name:
        type: fixed
        value: EliteaAI/elitea_issues
      max_count:
        type: fixed
        value: 100
    output:
      - milestone_issues
    structured_output: true
    transition: FilterVerifiedTickets

  # Step 3: Intersect - keep only items that are BOTH verified AND in milestone
  - id: FilterVerifiedTickets
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'verified_tickets': '[]', 'current_ticket_index': '0', 'total_tickets': '0'}

        try:
            # Get project board items (Verified on DEV Env status)
            project_raw = alita_state.get('project_items', '{}')
            project_data = json.loads(project_raw, strict=False) if isinstance(project_raw, str) else project_raw
            if not isinstance(project_data, dict):
                project_data = {}

            project_items = project_data.get('items', [])
            if not isinstance(project_items, list):
                project_items = []

            # Get milestone issues
            milestone_raw = alita_state.get('milestone_issues', '[]')
            milestone_issues = json.loads(milestone_raw, strict=False) if isinstance(milestone_raw, str) else milestone_raw
            if not isinstance(milestone_issues, list):
                milestone_issues = []

            # Build set of issue numbers in milestone R-2.0.7
            milestone_numbers = set()
            for issue in milestone_issues:
                num = issue.get('id')
                if num:
                    milestone_numbers.add(int(num))

            # Filter project items: keep only those with Verified status AND in milestone
            TARGET_STATUS = 'Verified on DEV Env'
            filtered_items = []

            for item in project_items:
                # Check status
                field_values = item.get('fieldValues', [])
                is_verified = False
                for fv in field_values:
                    if isinstance(fv, dict):
                        field_info = fv.get('field', {})
                        fname = field_info.get('name', '') if isinstance(field_info, dict) else ''
                        if fname == 'Status':
                            fval = fv.get('name', '') or fv.get('optionName', '')
                            if fval == TARGET_STATUS:
                                is_verified = True
                            break

                if not is_verified:
                    continue

                # Check if issue number is in milestone
                content = item.get('content', {})
                issue_number = content.get('number')
                if issue_number and int(issue_number) in milestone_numbers:
                    filtered_items.append(item)

            out = {
                'verified_tickets': json.dumps(filtered_items),
                'current_ticket_index': '0',
                'total_tickets': str(len(filtered_items))
            }
        except Exception as e:
            out = {'verified_tickets': '[]', 'current_ticket_index': '0', 'total_tickets': '0'}

        out
    input:
      - project_items
    output:
      - verified_tickets
      - current_ticket_index
      - total_tickets
    structured_output: true
    transition: CheckMoreTickets

  - id: CheckMoreTickets
    type: router
    input:
      - current_ticket_index
      - total_tickets
    condition: |
      {% set idx = current_ticket_index | int %}
      {% set total = total_tickets | int %}
      {% if idx < total %}
      PrepareCurrentTicket
      {% else %}
      FinalSummary
      {% endif %}
    routes:
      - PrepareCurrentTicket
      - FinalSummary
    default_output: FinalSummary

  - id: PrepareCurrentTicket
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'current_ticket': '{}'}

        try:
            tickets_raw = alita_state.get('verified_tickets', '[]')
            idx = int(alita_state.get('current_ticket_index', '0'))

            tickets = json.loads(tickets_raw, strict=False) if isinstance(tickets_raw, str) else tickets_raw
            if isinstance(tickets, list) and idx < len(tickets):
                # Each item from search_project_issues has structure:
                # {id, type, content: {id, number, title, url, state, labels, assignees}, fieldValues}
                out = {'current_ticket': json.dumps(tickets[idx])}
        except:
            pass

        out
    input:
      - verified_tickets
      - current_ticket_index
    output:
      - current_ticket
    structured_output: true
    transition: ProcessTicket

  - id: ProcessTicket
    type: code
    code:
      type: fixed
      value: |
        # DUMMY NODE - Replace with actual processing logic
        # This node should:
        # 1. Analyze the ticket content
        # 2. Extract test requirements
        # 3. Determine automation scope
        # 4. Generate test specification draft

        import json

        out = {'processed_result': 'processed'}

        try:
            ticket_raw = alita_state.get('current_ticket', '{}')
            ticket = json.loads(ticket_raw, strict=False) if isinstance(ticket_raw, str) else ticket_raw

            # search_project_issues item structure:
            # {id, type, content: {id, number, title, url, state, labels, assignees}, fieldValues}
            content = ticket.get('content', {})

            title = content.get('title', 'Unknown')
            number = content.get('number', 0)
            url = content.get('url', '')
            state = content.get('state', '')
            labels = content.get('labels', [])
            assignees = content.get('assignees', [])

            out = {
                'processed_result': json.dumps({
                    'status': 'processed',
                    'title': title,
                    'number': number,
                    'url': url,
                    'state': state,
                    'labels': labels,
                    'assignees': assignees
                })
            }
        except:
            pass

        out
    input:
      - current_ticket
    output:
      - processed_result
    structured_output: true
    transition: PrepareAutomationIssue

  - id: PrepareAutomationIssue
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'issue_title': '', 'issue_body': ''}

        try:
            ticket_raw = alita_state.get('current_ticket', '{}')
            processed_raw = alita_state.get('processed_result', '{}')

            ticket = json.loads(ticket_raw, strict=False) if isinstance(ticket_raw, str) else ticket_raw
            processed = json.loads(processed_raw, strict=False) if isinstance(processed_raw, str) else processed_raw

            # search_project_issues item structure:
            # {id, type, content: {id, number, title, url, state, labels, assignees}, fieldValues}
            content = ticket.get('content', {})

            title = content.get('title', 'Unknown')
            number = content.get('number', 0)
            url = content.get('url', '')
            labels = content.get('labels', [])

            # Build automation issue title
            issue_title = f"[Automate] {title}"

            # Format labels
            label_names = [l.get('name', '') for l in labels if l.get('name')]
            labels_str = ', '.join(label_names) if label_names else 'None'

            # Build automation issue body
            lines = [
                "## Source Ticket",
                "",
                f"- **Original Issue:** [{title}]({url})",
                f"- **Issue Number:** #{number}",
                f"- **Status:** Verified on DEV Env",
                f"- **Labels:** {labels_str}",
                "",
                "## Automation Scope",
                "",
                "<!-- TODO: Define test scenarios -->",
                "",
                "## Instructions",
                "",
                "1. **Branch from main** - Create fix branch from `main`: `git checkout main && git pull && git checkout -b AI_AQA/automate-<feature>`",
                "2. **Commit prefix** - All commits MUST start with `AI_AQA:`",
                "3. **Create PR to main** - Submit PR targeting `main` branch",
                "4. **Link to source** - Reference the original issue in PR description",
                "",
                "---",
                f"Auto-generated by Verified Ticket Intake Pipeline | Source: #{number}",
            ]

            out = {
                'issue_title': issue_title[:256],
                'issue_body': chr(10).join(lines)
            }
        except Exception as e:
            out = {'issue_title': 'Error', 'issue_body': str(e)}

        out
    input:
      - current_ticket
      - processed_result
    output:
      - issue_title
      - issue_body
    structured_output: true
    transition: CreateAutomationIssue

  # DEBUG MODE: Collect issues without creating them
  # To enable real issue creation, replace this code node with the toolkit node below:
  # ---
  # - id: CreateAutomationIssue
  #   type: toolkit
  #   toolkit_name: GitHub_Tools
  #   tool: create_issue_on_project
  #   input:
  #     - issue_title
  #     - issue_body
  #   input_mapping:
  #     board_repo:
  #       type: fixed
  #       value: EliteaAI/elitea-testing-public
  #     project_title:
  #       type: fixed
  #       value: Test Automation Factory
  #     title:
  #       type: variable
  #       value: issue_title
  #     body:
  #       type: variable
  #       value: issue_body
  #     labels:
  #       type: fixed
  #       value: '["aqa:intake"]'
  #     fields:
  #       type: fixed
  #       value:
  #         Status: Approved
  #     issue_repo:
  #       type: fixed
  #       value: EliteaAI/elitea-testing-public
  #   output:
  #     - issue_result
  #   structured_output: true
  #   transition: StoreAndNext
  # ---

  - id: CreateAutomationIssue
    type: code
    code:
      type: fixed
      value: |
        import json

        # DEBUG MODE: Simulate issue creation without actually creating
        out = {'issue_result': ''}

        try:
            title = alita_state.get('issue_title', '')
            body = alita_state.get('issue_body', '')

            # Build a mock result that shows what WOULD be created
            mock_result = {
                'mode': 'DRY_RUN',
                'would_create': {
                    'repo': 'EliteaAI/elitea-testing-public',
                    'project': 'Test Automation Factory',
                    'title': title,
                    'labels': ['aqa:intake'],
                    'status': 'Approved',
                    'body_preview': body[:200] + '...' if len(body) > 200 else body
                }
            }
            out = {'issue_result': json.dumps(mock_result)}
        except Exception as e:
            out = {'issue_result': json.dumps({'error': str(e)})}

        out
    input:
      - issue_title
      - issue_body
    output:
      - issue_result
    structured_output: true
    transition: StoreAndNext

  - id: StoreAndNext
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'created_issues': '[]', 'current_ticket_index': '0'}

        try:
            issue_result = alita_state.get('issue_result', '')
            created_raw = alita_state.get('created_issues', '[]')
            idx = int(alita_state.get('current_ticket_index', '0'))
            ticket_raw = alita_state.get('current_ticket', '{}')

            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw
            if not isinstance(created, list):
                created = []

            ticket = json.loads(ticket_raw, strict=False) if isinstance(ticket_raw, str) else ticket_raw

            # search_project_issues item structure:
            # {id, type, content: {id, number, title, url, state, labels, assignees}, fieldValues}
            content = ticket.get('content', {})

            created.append({
                'source_number': content.get('number', 0),
                'source_title': content.get('title', ''),
                'source_url': content.get('url', ''),
                'automation_issue': issue_result
            })

            out = {
                'created_issues': json.dumps(created),
                'current_ticket_index': str(idx + 1)
            }
        except:
            pass

        out
    input:
      - issue_result
      - created_issues
      - current_ticket_index
      - current_ticket
    output:
      - created_issues
      - current_ticket_index
    structured_output: true
    transition: CheckMoreTickets

  - id: FinalSummary
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'summary': 'No tickets processed'}

        try:
            created_raw = alita_state.get('created_issues', '[]')
            total = alita_state.get('total_tickets', '0')

            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw
            if not isinstance(created, list):
                created = []

            # Check if we're in dry run mode
            is_dry_run = False
            if created and isinstance(created[0].get('automation_issue'), str):
                try:
                    first_result = json.loads(created[0]['automation_issue'])
                    is_dry_run = first_result.get('mode') == 'DRY_RUN'
                except:
                    pass

            lines = [
                "## Verified Ticket Intake Summary",
                "",
            ]

            if is_dry_run:
                lines.append("### ⚠️ DRY RUN MODE - No issues were actually created")
                lines.append("")

            lines.extend([
                f"**Total verified tickets found:** {total}",
                f"**Issues {'collected (not created)' if is_dry_run else 'created'}:** {len(created)}",
                "",
            ])

            if created:
                lines.append("### Issues to Create" if is_dry_run else "### Created Issues")
                lines.append("")
                for idx, item in enumerate(created, 1):
                    source = item.get('source_number', '?')
                    source_title = item.get('source_title', 'Unknown')
                    result_raw = item.get('automation_issue', '')

                    lines.append(f"**{idx}. Source Ticket #{source}:** {source_title}")

                    # Parse the result to show details
                    try:
                        result = json.loads(result_raw) if isinstance(result_raw, str) else result_raw
                        if is_dry_run and 'would_create' in result:
                            wc = result['would_create']
                            lines.append(f"   - **Title:** {wc.get('title', 'N/A')}")
                            lines.append(f"   - **Target Repo:** {wc.get('repo', 'N/A')}")
                            lines.append(f"   - **Project:** {wc.get('project', 'N/A')}")
                            lines.append(f"   - **Labels:** {', '.join(wc.get('labels', []))}")
                            lines.append(f"   - **Status:** {wc.get('status', 'N/A')}")
                        else:
                            lines.append(f"   - Result: {str(result)[:150]}...")
                    except:
                        lines.append(f"   - Result: {result_raw[:150]}...")

                    lines.append("")

            if is_dry_run:
                lines.extend([
                    "---",
                    "**To create these issues for real:** Edit the pipeline YAML and uncomment the `GitHub_Tools.create_issue_on_project` toolkit node.",
                ])

            out = {'summary': chr(10).join(lines)}
        except Exception as e:
            out = {'summary': f'Error generating summary: {e}'}

        out
    input:
      - created_issues
      - total_tickets
    output:
      - summary
    structured_output: true
    transition: END
