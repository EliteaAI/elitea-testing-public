entry_point: START

state:
  input:
    type: str
  messages:
    type: list
  start:
    type: str
    value: ''
  project_items:
    type: str
    value: '[]'
  tms_test_cases:
    type: str
    value: '[]'
  debug_fetch:
    type: str
    value: ''
  debug_tms:
    type: str
    value: ''
  debug_filter:
    type: str
    value: ''
  verified_tickets:
    type: str
    value: '[]'
  grouped_issues:
    type: str
    value: '[]'
  current_group_index:
    type: str
    value: '0'
  total_groups:
    type: str
    value: '0'
  issue_title:
    type: str
    value: ''
  issue_body:
    type: str
    value: ''
  issue_fields:
    type: dict
    value: {}
  issue_result:
    type: str
    value: ''
  created_issues:
    type: str
    value: '[]'

nodes:
  - id: START
    type: code
    code:
      type: fixed
      value: |
        {'start': 'Pipeline started'}
    input: []
    output:
      - start
    structured_output: true
    transition: FetchProjectItems

  # Fetch issues with milestone R-2.0.7 using GitHub Issues API
  - id: FetchProjectItems
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: search_issues
    input: []
    input_mapping:
      search_query:
        type: fixed
        value: 'milestone:"R-2.0.7" state:open'
      repo_name:
        type: fixed
        value: EliteaAI/elitea_issues
      max_count:
        type: fixed
        value: 150
    output:
      - project_items
    structured_output: true
    transition: FetchTMSTestCases

  # Fetch short index with id, priority, path
  - id: FetchTMSTestCases
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: read_file
    input: []
    input_mapping:
      file_path:
        type: fixed
        value: index_automated_all_short.json
      repo_name:
        type: fixed
        value: EliteaAI/onetest-ai-tm-Elitea
    output:
      - tms_test_cases
    structured_output: true
    transition: DebugFetchResult

  # DEBUG: Show what we fetched
  - id: DebugFetchResult
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'debug_fetch': '', 'debug_tms': ''}

        try:
            items_raw = alita_state.get('project_items', '[]')
            debug_info = {
                'raw_type': str(type(items_raw)),
                'raw_length': len(str(items_raw)) if items_raw else 0
            }

            if isinstance(items_raw, list):
                debug_info['list_length'] = len(items_raw)

            out['debug_fetch'] = json.dumps(debug_info, indent=2)

            tms_raw = alita_state.get('tms_test_cases', '')
            tms_debug = {'raw_type': str(type(tms_raw)), 'raw_length': len(str(tms_raw)) if tms_raw else 0}

            try:
                if isinstance(tms_raw, str) and tms_raw.strip():
                    index_data = json.loads(tms_raw)
                    cases = index_data.get('cases', []) if isinstance(index_data, dict) else []
                    tms_debug['total_cases'] = len(cases)
                    critical = [c for c in cases if c.get('priority') == 'critical']
                    tms_debug['critical_cases'] = len(critical)
                    tms_debug['sample_ids'] = [c.get('id') for c in critical[:10]]
            except Exception as e:
                tms_debug['parse_error'] = str(e)

            out['debug_tms'] = json.dumps(tms_debug, indent=2)
        except Exception as e:
            out['debug_fetch'] = f'ERROR: {str(e)}'

        out
    input:
      - project_items
      - tms_test_cases
    output:
      - debug_fetch
      - debug_tms
    structured_output: true
    transition: FilterAndGroupTickets

  # Filter issues and group by module/feature for batch issue creation
  - id: FilterAndGroupTickets
    type: code
    code:
      type: fixed
      value: |
        import json
        import re

        out = {'verified_tickets': '[]', 'grouped_issues': '[]', 'current_group_index': '0', 'total_groups': '0', 'debug_filter': ''}

        # TEST MODE CONFIG
        MAX_ISSUES = 3
        MOCK_TEST_CASE_IDS = ['ELITEA-2671', 'ELITEA-2672']

        try:
            items_raw = alita_state.get('project_items', '[]')
            tms_raw = alita_state.get('tms_test_cases', '')

            # Parse items
            if isinstance(items_raw, str):
                items = json.loads(items_raw, strict=False)
            else:
                items = items_raw
            if not isinstance(items, list):
                items = []

            # Parse TMS index - build lookup: id -> {priority, path, module}
            tms_lookup = {}
            tms_critical_ids = set()
            try:
                if isinstance(tms_raw, str) and tms_raw.strip():
                    index_data = json.loads(tms_raw)
                    cases = index_data.get('cases', []) if isinstance(index_data, dict) else []
                    for c in cases:
                        case_id = c.get('id')
                        if case_id:
                            path = c.get('path', '')
                            # Extract module from path: tests/automated-full-regression-ui/<module>/...
                            module_match = re.search(r'tests/automated-full-regression-ui/([^/]+)/', path)
                            module = module_match.group(1) if module_match else 'unknown'
                            tms_lookup[case_id] = {
                                'priority': c.get('priority', 'medium'),
                                'path': path,
                                'module': module
                            }
                            if c.get('priority') == 'critical':
                                tms_critical_ids.add(case_id)
            except:
                pass

            # Process first MAX_ISSUES items and collect test cases
            verified = []
            real_links = 0
            mocked_links = 0

            for idx, item in enumerate(items[:MAX_ISSUES]):
                if isinstance(item, str):
                    try:
                        item = json.loads(item, strict=False)
                    except:
                        continue
                if not isinstance(item, dict):
                    continue

                description = item.get('description', '') or ''
                title = item.get('title', '') or ''
                issue_elitea_ids = set(re.findall(r'ELITEA-\d+', f"{title} {description}"))

                # Check for real critical test case links
                linked_critical = issue_elitea_ids & tms_critical_ids

                # Determine test cases
                if linked_critical:
                    test_cases = list(linked_critical)
                    is_mocked = False
                    real_links += 1
                elif idx % 2 == 1:
                    test_cases = MOCK_TEST_CASE_IDS
                    is_mocked = True
                    mocked_links += 1
                else:
                    test_cases = []
                    is_mocked = False

                verified.append({
                    'issue_id': item.get('id'),
                    'issue_title': title,
                    'issue_url': item.get('url', ''),
                    'test_cases': test_cases,
                    'is_mocked': is_mocked
                })

            # Group test cases by module
            module_groups = {}
            for v in verified:
                for tc_id in v.get('test_cases', []):
                    tc_info = tms_lookup.get(tc_id, {'module': 'unknown', 'priority': 'medium', 'path': ''})
                    module = tc_info['module']
                    if module not in module_groups:
                        module_groups[module] = {
                            'module': module,
                            'cases': [],
                            'source_issues': []
                        }
                    module_groups[module]['cases'].append({
                        'id': tc_id,
                        'priority': tc_info['priority'],
                        'path': tc_info['path']
                    })
                    if v['issue_id'] not in [s['id'] for s in module_groups[module]['source_issues']]:
                        module_groups[module]['source_issues'].append({
                            'id': v['issue_id'],
                            'title': v['issue_title'],
                            'url': v['issue_url']
                        })

            grouped = list(module_groups.values())

            debug_info = {
                'mode': 'TEST_MODE',
                'max_issues': MAX_ISSUES,
                'input_issues': len(items),
                'verified_count': len(verified),
                'tms_cases_found': len(tms_lookup),
                'critical_cases': len(tms_critical_ids),
                'real_links': real_links,
                'mocked_links': mocked_links,
                'groups_by_module': len(grouped),
                'groups': [{
                    'module': g['module'],
                    'case_count': len(g['cases']),
                    'cases': [c['id'] for c in g['cases'][:5]]
                } for g in grouped]
            }

            out = {
                'verified_tickets': json.dumps(verified),
                'grouped_issues': json.dumps(grouped),
                'current_group_index': '0',
                'total_groups': str(len(grouped)),
                'debug_filter': json.dumps(debug_info, indent=2)
            }
        except Exception as e:
            import traceback
            out['debug_filter'] = f'ERROR: {str(e)} | {traceback.format_exc()[:200]}'

        out
    input:
      - project_items
      - tms_test_cases
    output:
      - verified_tickets
      - grouped_issues
      - current_group_index
      - total_groups
      - debug_filter
    structured_output: true
    transition: CheckMoreGroups

  # Loop through groups
  - id: CheckMoreGroups
    type: router
    input:
      - current_group_index
      - total_groups
    condition: |
      {% set idx = current_group_index | int %}
      {% set total = total_groups | int %}
      {% if idx < total %}
      PrepareGroupIssue
      {% else %}
      FinalSummary
      {% endif %}
    routes:
      - PrepareGroupIssue
      - FinalSummary
    default_output: FinalSummary

  # Prepare issue for current group (format like #1400)
  - id: PrepareGroupIssue
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'issue_title': '', 'issue_body': '', 'issue_fields': {'Status': 'Promoted'}}

        try:
            groups_raw = alita_state.get('grouped_issues', '[]')
            idx = int(alita_state.get('current_group_index', '0'))

            groups = json.loads(groups_raw, strict=False) if isinstance(groups_raw, str) else groups_raw
            if not isinstance(groups, list) or idx >= len(groups):
                out = {'issue_title': '', 'issue_body': '', 'issue_fields': {'Status': 'Promoted'}}
            else:
                group = groups[idx]
                module = group.get('module', 'unknown')
                cases = group.get('cases', [])
                source_issues = group.get('source_issues', [])

                # Count by priority
                critical = [c for c in cases if c.get('priority') == 'critical']
                high = [c for c in cases if c.get('priority') == 'high']
                medium = [c for c in cases if c.get('priority') == 'medium']
                low = [c for c in cases if c.get('priority') == 'low']

                # Build title like #1400
                title = f"[Automate][{module}] {len(cases)} test cases from verified tickets"

                # Build body
                lines = [
                    "## What this covers",
                    "",
                    f"Automate **{len(cases)} test cases** in the `{module}` area from verified R-2.0.7 tickets.",
                    "",
                    "| | |",
                    "|---|---:|",
                    f"| Cases in `{module}` | {len(cases)} |",
                    f"| Critical priority | {len(critical)} |",
                    f"| High priority | {len(high)} |",
                    f"| Medium priority | {len(medium)} |",
                    f"| Low priority | {len(low)} |",
                    "",
                    "**Source:** Verified tickets from milestone R-2.0.7",
                    "",
                    "---",
                    "",
                    "## Source Tickets",
                    "",
                ]

                for si in source_issues[:10]:
                    lines.append(f"- [{si.get('title', 'Unknown')[:60]}...]({si.get('url', '')})")

                lines.extend([
                    "",
                    "---",
                    "",
                    f"## Test Cases ({len(cases)})",
                    "",
                    "| # | Case | Title | Pri |",
                    "|---:|---|---|---|",
                ])

                for i, c in enumerate(cases[:20], 1):
                    case_id = c.get('id', 'N/A')
                    path = c.get('path', '')
                    priority = c.get('priority', 'medium')
                    # Extract title from path (last segment without extension)
                    title_from_path = path.split('/')[-1].replace('.md', '').replace(f'{case_id}_', '').replace('-', ' ')[:50]
                    case_url = f"https://github.com/EliteaAI/onetest-ai-tm-Elitea/blob/main/{path}"
                    lines.append(f"| {i} | [{case_id}]({case_url}) | {title_from_path} | {priority} |")

                if len(cases) > 20:
                    lines.append(f"| ... | +{len(cases) - 20} more | | |")

                lines.extend([
                    "",
                    "---",
                    "",
                    "<sub>Generated by Verified Ticket Intake Pipeline</sub>",
                ])

                out = {
                    'issue_title': title[:256],
                    'issue_body': chr(10).join(lines),
                    'issue_fields': {'Status': 'Promoted'}
                }
        except Exception as e:
            out = {'issue_title': f'Error: {str(e)}', 'issue_body': '', 'issue_fields': {'Status': 'Promoted'}}

        out
    input:
      - grouped_issues
      - current_group_index
    output:
      - issue_title
      - issue_body
      - issue_fields
    structured_output: true
    transition: CreateIssue

  # Create issue on board #9 in 'Promoted' column
  - id: CreateIssue
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: create_issue_on_project
    input:
      - issue_title
      - issue_body
      - issue_fields
    input_mapping:
      board_repo:
        type: fixed
        value: EliteaAI/elitea-testing-public
      project_title:
        type: fixed
        value: Test Automation Factory
      title:
        type: variable
        value: issue_title
      body:
        type: variable
        value: issue_body
      fields:
        type: variable
        value: issue_fields
      issue_repo:
        type: fixed
        value: EliteaAI/elitea-testing-public
    output:
      - issue_result
    structured_output: true
    transition: StoreAndNext

  - id: StoreAndNext
    type: code
    code:
      type: fixed
      value: |
        import json
        import re

        out = {'created_issues': '[]', 'current_group_index': '0'}

        try:
            issue_result = alita_state.get('issue_result', '')
            created_raw = alita_state.get('created_issues', '[]')
            idx = int(alita_state.get('current_group_index', '0'))
            groups_raw = alita_state.get('grouped_issues', '[]')
            issue_title = alita_state.get('issue_title', '')

            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw
            if not isinstance(created, list):
                created = []

            groups = json.loads(groups_raw, strict=False) if isinstance(groups_raw, str) else groups_raw

            # Extract issue number from result
            issue_url = ''
            if issue_result:
                match = re.search(r"issue with number ['\"]?(\d+)['\"]?", str(issue_result), re.IGNORECASE)
                if match:
                    issue_url = f"https://github.com/EliteaAI/elitea-testing-public/issues/{match.group(1)}"

            group = groups[idx] if idx < len(groups) else {}
            created.append({
                'module': group.get('module', 'unknown'),
                'case_count': len(group.get('cases', [])),
                'issue_url': issue_url,
                'title': issue_title
            })

            out = {
                'created_issues': json.dumps(created),
                'current_group_index': str(idx + 1)
            }
        except Exception as e:
            out = {
                'created_issues': json.dumps([{'error': str(e)}]),
                'current_group_index': str(int(alita_state.get('current_group_index', '0')) + 1)
            }

        out
    input:
      - issue_result
      - created_issues
      - current_group_index
      - grouped_issues
      - issue_title
    output:
      - created_issues
      - current_group_index
    structured_output: true
    transition: CheckMoreGroups

  - id: FinalSummary
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'summary': 'No groups processed'}

        try:
            created_raw = alita_state.get('created_issues', '[]')
            total_groups = alita_state.get('total_groups', '0')
            debug_fetch = alita_state.get('debug_fetch', '')
            debug_tms = alita_state.get('debug_tms', '')
            debug_filter = alita_state.get('debug_filter', '')

            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw
            if not isinstance(created, list):
                created = []

            lines = [
                "## Verified Ticket Intake Summary",
                "",
                "### DEBUG: Pipeline State",
                "",
                "**FetchProjectItems:**",
                "```json",
                debug_fetch if debug_fetch else "N/A",
                "```",
                "",
                "**FetchTMSTestCases:**",
                "```json",
                debug_tms if debug_tms else "N/A",
                "```",
                "",
                "**FilterAndGroupTickets:**",
                "```json",
                debug_filter if debug_filter else "N/A",
                "```",
                "",
                "---",
                "",
                f"**Total groups:** {total_groups}",
                f"**Issues created:** {len(created)}",
                "",
                "### Created Issues",
                "",
            ]

            total_cases = 0
            for i, item in enumerate(created, 1):
                module = item.get('module', 'unknown')
                case_count = item.get('case_count', 0)
                issue_url = item.get('issue_url', '')
                title = item.get('title', '')
                total_cases += case_count

                if issue_url:
                    lines.append(f"{i}. **{module}** ({case_count} cases): [{title[:50]}...]({issue_url})")
                else:
                    lines.append(f"{i}. **{module}** ({case_count} cases): {title[:50]}... (URL not available)")

            if not created:
                lines.append("- No issues created")

            lines.extend([
                "",
                f"**Total test cases covered:** {total_cases}",
                "",
                "---",
                "Issues posted to board #9 in 'Promoted' column.",
            ])

            out = {'summary': chr(10).join(lines)}
        except Exception as e:
            out = {'summary': f'Error: {str(e)}'}

        out
    input:
      - created_issues
      - total_groups
      - debug_fetch
      - debug_tms
      - debug_filter
    output:
      - summary
    structured_output: true
    transition: END
