entry_point: START

state:
  input:
    type: str
  messages:
    type: list
  start:
    type: str
    value: ''
  project_items:
    type: str
    value: '[]'
  tms_test_cases:
    type: str
    value: '[]'
  existing_board_issues:
    type: str
    value: '[]'
  all_tickets:
    type: str
    value: '[]'
  tickets_with_cases:
    type: str
    value: '[]'
  tickets_already_tracked:
    type: str
    value: '[]'
  tickets_to_process:
    type: str
    value: '[]'
  grouped_issues:
    type: str
    value: '[]'
  current_group_index:
    type: str
    value: '0'
  total_groups:
    type: str
    value: '0'
  issue_title:
    type: str
    value: ''
  issue_body:
    type: str
    value: ''
  issue_fields:
    type: dict
    value: {}
  issue_result:
    type: str
    value: ''
  issue_number:
    type: str
    value: '0'
  current_source_issues:
    type: str
    value: '[]'
  current_source_index:
    type: str
    value: '0'
  total_source_issues:
    type: str
    value: '0'
  comment_result:
    type: str
    value: ''
  created_issues:
    type: str
    value: '[]'

nodes:
  - id: START
    type: code
    code:
      type: fixed
      value: |
        {'start': 'Pipeline started'}
    input: []
    output:
      - start
    structured_output: true
    transition: FetchProjectItems

  # Fetch all open issues with milestone R-2.0.7
  - id: FetchProjectItems
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: search_issues
    input: []
    input_mapping:
      search_query:
        type: fixed
        value: 'milestone:"R-2.0.7" state:open'
      repo_name:
        type: fixed
        value: EliteaAI/elitea_issues
      max_count:
        type: fixed
        value: 200
    output:
      - project_items
    structured_output: true
    transition: FetchTMSTestCases

  # Fetch TMS index
  - id: FetchTMSTestCases
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: read_file
    input: []
    input_mapping:
      file_path:
        type: fixed
        value: index_automated_all_short.json
      repo_name:
        type: fixed
        value: EliteaAI/onetest-ai-tm-Elitea
    output:
      - tms_test_cases
    structured_output: true
    transition: FetchExistingBoardIssues

  # Fetch existing aqa:intake issues to detect already-tracked tickets
  - id: FetchExistingBoardIssues
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: search_issues
    input: []
    input_mapping:
      search_query:
        type: fixed
        value: 'is:issue repo:EliteaAI/elitea-testing-public label:aqa:intake'
      repo_name:
        type: fixed
        value: EliteaAI/elitea-testing-public
      max_count:
        type: fixed
        value: 200
    output:
      - existing_board_issues
    structured_output: true
    transition: ClassifyTickets

  # Classify all tickets: with test cases, already tracked, to process
  - id: ClassifyTickets
    type: code
    code:
      type: fixed
      value: |
        import json
        import re

        out = {
            'all_tickets': '[]',
            'tickets_with_cases': '[]',
            'tickets_already_tracked': '[]',
            'tickets_to_process': '[]',
            'grouped_issues': '[]',
            'current_group_index': '0',
            'total_groups': '0'
        }

        try:
            items_raw = alita_state.get('project_items', '[]')
            tms_raw = alita_state.get('tms_test_cases', '')
            existing_raw = alita_state.get('existing_board_issues', '[]')

            # Parse milestone issues
            if isinstance(items_raw, str):
                items = json.loads(items_raw, strict=False)
            else:
                items = items_raw
            if not isinstance(items, list):
                items = []

            # Parse existing board issues - extract source issue numbers
            existing_source_numbers = set()
            existing_issue_urls = {}  # source_id -> automation_issue_url
            if isinstance(existing_raw, str):
                try:
                    existing_issues = json.loads(existing_raw, strict=False)
                except:
                    existing_issues = []
            else:
                existing_issues = existing_raw
            if not isinstance(existing_issues, list):
                existing_issues = []

            for ei in existing_issues:
                if isinstance(ei, dict):
                    body = ei.get('body', '') or ei.get('description', '') or ''
                    title = ei.get('title', '') or ''
                    ei_url = ei.get('url', '') or ei.get('html_url', '')
                    # Look for source issue references
                    matches = re.findall(r'elitea_issues/issues/(\d+)|#(\d{4,})', f"{title} {body}")
                    for m in matches:
                        num = m[0] or m[1]
                        if num:
                            existing_source_numbers.add(int(num))
                            existing_issue_urls[int(num)] = ei_url

            # Parse TMS index
            tms_lookup = {}
            tms_all_ids = set()
            try:
                if isinstance(tms_raw, str) and tms_raw.strip():
                    index_data = json.loads(tms_raw)
                    cases = index_data.get('cases', []) if isinstance(index_data, dict) else []
                    for c in cases:
                        case_id = c.get('id')
                        if case_id:
                            path = c.get('path', '')
                            module_match = re.search(r'tests/automated-full-regression-ui/([^/]+)/', path)
                            module = module_match.group(1) if module_match else 'unknown'
                            tms_lookup[case_id] = {
                                'priority': c.get('priority', 'medium'),
                                'path': path,
                                'module': module
                            }
                            tms_all_ids.add(case_id)
            except:
                pass

            # Classify each ticket
            all_tickets = []
            tickets_with_cases = []
            tickets_already_tracked = []
            tickets_to_process = []

            for item in items:
                if isinstance(item, str):
                    try:
                        item = json.loads(item, strict=False)
                    except:
                        continue
                if not isinstance(item, dict):
                    continue

                issue_id = item.get('id')
                description = item.get('description', '') or ''
                title = item.get('title', '') or ''
                issue_url = item.get('url', '')

                # Find ELITEA-XXXX IDs in issue
                issue_elitea_ids = set(re.findall(r'ELITEA-\d+', f"{title} {description}"))
                linked_cases = issue_elitea_ids & tms_all_ids

                ticket_info = {
                    'id': issue_id,
                    'title': title,
                    'url': issue_url,
                    'linked_cases': list(linked_cases),
                    'has_cases': len(linked_cases) > 0
                }

                all_tickets.append(ticket_info)

                if linked_cases:
                    tickets_with_cases.append(ticket_info)

                    # Check if already tracked
                    if issue_id in existing_source_numbers:
                        ticket_info['automation_url'] = existing_issue_urls.get(issue_id, '')
                        tickets_already_tracked.append(ticket_info)
                    else:
                        tickets_to_process.append(ticket_info)

            # Group tickets_to_process by module
            module_groups = {}
            for t in tickets_to_process:
                for tc_id in t.get('linked_cases', []):
                    tc_info = tms_lookup.get(tc_id, {'module': 'unknown', 'priority': 'medium', 'path': ''})
                    module = tc_info['module']
                    if module not in module_groups:
                        module_groups[module] = {
                            'module': module,
                            'cases': [],
                            'source_issues': []
                        }
                    if tc_id not in [c['id'] for c in module_groups[module]['cases']]:
                        module_groups[module]['cases'].append({
                            'id': tc_id,
                            'priority': tc_info['priority'],
                            'path': tc_info['path']
                        })
                    if t['id'] not in [s['id'] for s in module_groups[module]['source_issues']]:
                        module_groups[module]['source_issues'].append({
                            'id': t['id'],
                            'title': t['title'],
                            'url': t['url']
                        })

            grouped = list(module_groups.values())

            out = {
                'all_tickets': json.dumps(all_tickets),
                'tickets_with_cases': json.dumps(tickets_with_cases),
                'tickets_already_tracked': json.dumps(tickets_already_tracked),
                'tickets_to_process': json.dumps(tickets_to_process),
                'grouped_issues': json.dumps(grouped),
                'current_group_index': '0',
                'total_groups': str(len(grouped))
            }
        except Exception as e:
            import traceback
            out['all_tickets'] = json.dumps([{'error': str(e), 'trace': traceback.format_exc()[:300]}])

        out
    input:
      - project_items
      - tms_test_cases
      - existing_board_issues
    output:
      - all_tickets
      - tickets_with_cases
      - tickets_already_tracked
      - tickets_to_process
      - grouped_issues
      - current_group_index
      - total_groups
    structured_output: true
    transition: CheckMoreGroups

  # Loop through groups
  - id: CheckMoreGroups
    type: router
    input:
      - current_group_index
      - total_groups
    condition: |
      {% set idx = current_group_index | int %}
      {% set total = total_groups | int %}
      {% if idx < total %}
      PrepareGroupIssue
      {% else %}
      BuildFinalOutput
      {% endif %}
    routes:
      - PrepareGroupIssue
      - BuildFinalOutput
    default_output: BuildFinalOutput

  # Prepare issue for current group
  - id: PrepareGroupIssue
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'issue_title': '', 'issue_body': '', 'issue_fields': {'Status': 'Promoted'}, 'current_source_issues': '[]'}

        try:
            groups_raw = alita_state.get('grouped_issues', '[]')
            idx = int(alita_state.get('current_group_index', '0'))

            groups = json.loads(groups_raw, strict=False) if isinstance(groups_raw, str) else groups_raw
            if not isinstance(groups, list) or idx >= len(groups):
                pass
            else:
                group = groups[idx]
                module = group.get('module', 'unknown')
                cases = group.get('cases', [])
                source_issues = group.get('source_issues', [])

                # Count by priority
                critical = [c for c in cases if c.get('priority') == 'critical']
                high = [c for c in cases if c.get('priority') == 'high']
                medium = [c for c in cases if c.get('priority') == 'medium']
                low = [c for c in cases if c.get('priority') == 'low']

                title = f"[Automate][{module}] {len(cases)} test cases from R-2.0.7 tickets"

                lines = [
                    "## What this covers",
                    "",
                    f"Automate **{len(cases)} test cases** in the `{module}` area from R-2.0.7 milestone tickets.",
                    "",
                    "| | |",
                    "|---|---:|",
                    f"| Cases in `{module}` | {len(cases)} |",
                    f"| Critical priority | {len(critical)} |",
                    f"| High priority | {len(high)} |",
                    f"| Medium priority | {len(medium)} |",
                    f"| Low priority | {len(low)} |",
                    "",
                    "---",
                    "",
                    "## Source Tickets",
                    "",
                ]

                for si in source_issues[:15]:
                    si_title = si.get('title', 'Unknown')[:60]
                    si_url = si.get('url', '')
                    si_id = si.get('id', '')
                    lines.append(f"- [#{si_id} {si_title}...]({si_url})")

                if len(source_issues) > 15:
                    lines.append(f"- ... and {len(source_issues) - 15} more")

                lines.extend([
                    "",
                    "---",
                    "",
                    f"## Test Cases ({len(cases)})",
                    "",
                    "| # | Case | Priority |",
                    "|---:|---|---|",
                ])

                for i, c in enumerate(cases[:30], 1):
                    case_id = c.get('id', 'N/A')
                    path = c.get('path', '')
                    priority = c.get('priority', 'medium')
                    case_url = f"https://github.com/EliteaAI/onetest-ai-tm-Elitea/blob/main/{path}"
                    lines.append(f"| {i} | [{case_id}]({case_url}) | {priority} |")

                if len(cases) > 30:
                    lines.append(f"| ... | +{len(cases) - 30} more | |")

                lines.extend([
                    "",
                    "---",
                    "",
                    "<sub>Generated by Verified Ticket Intake Pipeline</sub>",
                ])

                out = {
                    'issue_title': title[:256],
                    'issue_body': chr(10).join(lines),
                    'issue_fields': {'Status': 'Promoted'},
                    'current_source_issues': json.dumps(source_issues)
                }
        except Exception as e:
            out = {'issue_title': f'Error: {str(e)}', 'issue_body': '', 'issue_fields': {'Status': 'Promoted'}, 'current_source_issues': '[]'}

        out
    input:
      - grouped_issues
      - current_group_index
    output:
      - issue_title
      - issue_body
      - issue_fields
      - current_source_issues
    structured_output: true
    transition: CreateIssue

  # Create issue on board #9
  - id: CreateIssue
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: create_issue_on_project
    input:
      - issue_title
      - issue_body
      - issue_fields
    input_mapping:
      board_repo:
        type: fixed
        value: EliteaAI/elitea-testing-public
      project_title:
        type: fixed
        value: Test Automation Factory
      title:
        type: variable
        value: issue_title
      body:
        type: variable
        value: issue_body
      labels:
        type: fixed
        value:
          - aqa:intake
      fields:
        type: variable
        value: issue_fields
      issue_repo:
        type: fixed
        value: EliteaAI/elitea-testing-public
    output:
      - issue_result
    structured_output: true
    transition: ExtractIssueNumber

  # Extract issue number
  - id: ExtractIssueNumber
    type: code
    code:
      type: fixed
      value: |
        import re

        out = {'issue_number': '0'}

        try:
            issue_result = alita_state.get('issue_result', '')
            if issue_result:
                match = re.search(r"issue with number ['\"]?(\d+)['\"]?", str(issue_result), re.IGNORECASE)
                if match:
                    out = {'issue_number': match.group(1)}
        except:
            pass

        out
    input:
      - issue_result
    output:
      - issue_number
    structured_output: true
    transition: PrepareSourceComments

  # Prepare to comment on source issues
  - id: PrepareSourceComments
    type: code
    code:
      type: fixed
      value: |
        import json

        sources_raw = alita_state.get('current_source_issues', '[]')
        try:
            sources = json.loads(sources_raw, strict=False) if isinstance(sources_raw, str) else sources_raw
            total = len(sources) if isinstance(sources, list) else 0
        except:
            total = 0

        out = {'current_source_index': '0', 'total_source_issues': str(total)}
        out
    input:
      - current_source_issues
    output:
      - current_source_index
      - total_source_issues
    structured_output: true
    transition: CheckMoreSourceIssues

  # Loop through source issues
  - id: CheckMoreSourceIssues
    type: router
    input:
      - current_source_index
      - total_source_issues
    condition: |
      {% set idx = current_source_index | int %}
      {% set total = total_source_issues | int %}
      {% if idx < total %}
      CommentOnSourceIssue
      {% else %}
      StoreAndNextGroup
      {% endif %}
    routes:
      - CommentOnSourceIssue
      - StoreAndNextGroup
    default_output: StoreAndNextGroup

  # Prepare comment for source issue
  - id: CommentOnSourceIssue
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'comment_body': '', 'source_issue_id': '0'}

        try:
            sources_raw = alita_state.get('current_source_issues', '[]')
            idx = int(alita_state.get('current_source_index', '0'))
            issue_number = alita_state.get('issue_number', '0')

            sources = json.loads(sources_raw, strict=False) if isinstance(sources_raw, str) else sources_raw
            if isinstance(sources, list) and idx < len(sources):
                source = sources[idx]
                source_id = source.get('id', 0)

                automation_url = f"https://github.com/EliteaAI/elitea-testing-public/issues/{issue_number}"
                comment = f"Automation task created: {automation_url}"

                out = {
                    'comment_body': comment,
                    'source_issue_id': str(source_id)
                }
        except:
            pass

        out
    input:
      - current_source_issues
      - current_source_index
      - issue_number
    output:
      - comment_body
      - source_issue_id
    structured_output: true
    transition: PostCommentToSource

  # Post comment
  - id: PostCommentToSource
    type: toolkit
    toolkit_name: GitHub_Tools
    tool: update_issue
    input:
      - source_issue_id
      - comment_body
    input_mapping:
      repo_name:
        type: fixed
        value: EliteaAI/elitea_issues
      issue_id:
        type: variable
        value: source_issue_id
      comment:
        type: variable
        value: comment_body
    output:
      - comment_result
    structured_output: true
    transition: NextSourceIssue

  # Next source
  - id: NextSourceIssue
    type: code
    code:
      type: fixed
      value: |
        idx = int(alita_state.get('current_source_index', '0'))
        {'current_source_index': str(idx + 1)}
    input:
      - current_source_index
    output:
      - current_source_index
    structured_output: true
    transition: CheckMoreSourceIssues

  # Store and next group
  - id: StoreAndNextGroup
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'created_issues': '[]', 'current_group_index': '0'}

        try:
            issue_number = alita_state.get('issue_number', '0')
            issue_title = alita_state.get('issue_title', '')
            created_raw = alita_state.get('created_issues', '[]')
            idx = int(alita_state.get('current_group_index', '0'))
            groups_raw = alita_state.get('grouped_issues', '[]')
            sources_raw = alita_state.get('current_source_issues', '[]')

            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw
            if not isinstance(created, list):
                created = []

            groups = json.loads(groups_raw, strict=False) if isinstance(groups_raw, str) else groups_raw
            sources = json.loads(sources_raw, strict=False) if isinstance(sources_raw, str) else sources_raw

            issue_url = f"https://github.com/EliteaAI/elitea-testing-public/issues/{issue_number}" if issue_number != '0' else ''

            group = groups[idx] if idx < len(groups) else {}
            created.append({
                'module': group.get('module', 'unknown'),
                'case_count': len(group.get('cases', [])),
                'source_count': len(sources) if isinstance(sources, list) else 0,
                'issue_url': issue_url,
                'issue_number': issue_number,
                'title': issue_title
            })

            out = {
                'created_issues': json.dumps(created),
                'current_group_index': str(idx + 1)
            }
        except Exception as e:
            out = {
                'created_issues': json.dumps([{'error': str(e)}]),
                'current_group_index': str(int(alita_state.get('current_group_index', '0')) + 1)
            }

        out
    input:
      - issue_number
      - issue_title
      - created_issues
      - current_group_index
      - grouped_issues
      - current_source_issues
    output:
      - created_issues
      - current_group_index
    structured_output: true
    transition: CheckMoreGroups

  # Final output like test_failure_intake.yml BuildFinalOutput
  - id: BuildFinalOutput
    type: code
    code:
      type: fixed
      value: |
        import json

        out = {'summary': 'Pipeline completed'}

        try:
            all_tickets_raw = alita_state.get('all_tickets', '[]')
            tickets_with_cases_raw = alita_state.get('tickets_with_cases', '[]')
            tickets_already_tracked_raw = alita_state.get('tickets_already_tracked', '[]')
            tickets_to_process_raw = alita_state.get('tickets_to_process', '[]')
            created_raw = alita_state.get('created_issues', '[]')

            all_tickets = json.loads(all_tickets_raw, strict=False) if isinstance(all_tickets_raw, str) else all_tickets_raw
            tickets_with_cases = json.loads(tickets_with_cases_raw, strict=False) if isinstance(tickets_with_cases_raw, str) else tickets_with_cases_raw
            tickets_already_tracked = json.loads(tickets_already_tracked_raw, strict=False) if isinstance(tickets_already_tracked_raw, str) else tickets_already_tracked_raw
            tickets_to_process = json.loads(tickets_to_process_raw, strict=False) if isinstance(tickets_to_process_raw, str) else tickets_to_process_raw
            created = json.loads(created_raw, strict=False) if isinstance(created_raw, str) else created_raw

            if not isinstance(all_tickets, list): all_tickets = []
            if not isinstance(tickets_with_cases, list): tickets_with_cases = []
            if not isinstance(tickets_already_tracked, list): tickets_already_tracked = []
            if not isinstance(tickets_to_process, list): tickets_to_process = []
            if not isinstance(created, list): created = []

            lines = [
                "## Verified Ticket Intake - Summary",
                "",
                "### Statistics",
                "",
                "| Metric | Count |",
                "|---|---:|",
                f"| Total R-2.0.7 issues | {len(all_tickets)} |",
                f"| Issues with linked test cases | {len(tickets_with_cases)} |",
                f"| Already have automation task | {len(tickets_already_tracked)} |",
                f"| New issues to process | {len(tickets_to_process)} |",
                f"| Automation issues created | {len(created)} |",
                "",
            ]

            # Created issues section
            if created:
                total_cases = sum(i.get('case_count', 0) for i in created)
                total_sources = sum(i.get('source_count', 0) for i in created)

                lines.extend([
                    "---",
                    "",
                    f"### Created Issues ({len(created)})",
                    "",
                ])

                for i, item in enumerate(created, 1):
                    module = item.get('module', 'unknown')
                    case_count = item.get('case_count', 0)
                    source_count = item.get('source_count', 0)
                    issue_url = item.get('issue_url', '')
                    title = item.get('title', '')[:60]

                    if issue_url:
                        lines.append(f"{i}. **{module}** ({case_count} cases, {source_count} source tickets): [{title}...]({issue_url})")
                    else:
                        lines.append(f"{i}. **{module}** ({case_count} cases): {title}...")

                lines.extend([
                    "",
                    f"**Total test cases covered:** {total_cases}",
                    f"**Total source tickets linked:** {total_sources}",
                ])

            # Already tracked section
            if tickets_already_tracked:
                lines.extend([
                    "",
                    "---",
                    "",
                    f"### Already In Progress ({len(tickets_already_tracked)} tickets)",
                    "",
                ])
                for t in tickets_already_tracked[:10]:
                    t_id = t.get('id', '?')
                    t_title = t.get('title', 'Unknown')[:50]
                    t_url = t.get('url', '')
                    auto_url = t.get('automation_url', '')
                    if t_url and auto_url:
                        lines.append(f"- [#{t_id}]({t_url}): {t_title}... → [Automation]({auto_url})")
                    elif t_url:
                        lines.append(f"- [#{t_id}]({t_url}): {t_title}...")
                    else:
                        lines.append(f"- #{t_id}: {t_title}...")

                if len(tickets_already_tracked) > 10:
                    lines.append(f"- ... and {len(tickets_already_tracked) - 10} more")

            # Issues with test cases but not yet processed (for info)
            issues_with_cases_not_tracked = [t for t in tickets_with_cases if t['id'] not in [x['id'] for x in tickets_already_tracked] and t['id'] not in [x['id'] for x in tickets_to_process]]
            # This should be empty if logic is correct, but include for debugging

            # No test cases section
            no_cases = [t for t in all_tickets if not t.get('has_cases')]
            if no_cases:
                lines.extend([
                    "",
                    "---",
                    "",
                    f"### No Test Cases Linked ({len(no_cases)} tickets)",
                    "",
                    "These R-2.0.7 issues don't have ELITEA-XXXX test case references:",
                    "",
                ])
                for t in no_cases[:15]:
                    t_id = t.get('id', '?')
                    t_title = t.get('title', 'Unknown')[:50]
                    t_url = t.get('url', '')
                    if t_url:
                        lines.append(f"- [#{t_id}]({t_url}): {t_title}...")
                    else:
                        lines.append(f"- #{t_id}: {t_title}...")

                if len(no_cases) > 15:
                    lines.append(f"- ... and {len(no_cases) - 15} more")

            lines.extend([
                "",
                "---",
                "",
                "Issues posted to board #9 in 'Promoted' column. Source tickets commented with automation link.",
            ])

            out = {'summary': chr(10).join(lines)}
        except Exception as e:
            import traceback
            out = {'summary': f'Error: {str(e)}\\n{traceback.format_exc()[:500]}'}

        out
    input:
      - all_tickets
      - tickets_with_cases
      - tickets_already_tracked
      - tickets_to_process
      - created_issues
    output:
      - summary
    structured_output: true
    transition: END
