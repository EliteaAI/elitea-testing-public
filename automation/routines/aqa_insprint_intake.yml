  - id: FetchProjectItems
    type: code
    code:
      type: fixed
      value: |
        import json
        import re
        import requests

        # Open milestone issues whose ELITEA Board (project #1) Status is VERIFIED_STATUS.
        # search_issues does not return board fields, so this runs one GraphQL search.
        # Case IDs mentioned in the issue timeline (commits, cross-referenced issues/PRs,
        # comments) are collected into linked_case_ids, e.g. a TMS commit "add: ELITEA-4127 ... (#6835)".
        MILESTONE = 'R-2.0.8'
        VERIFIED_STATUS = 'Verified on DEV Env'
        BOARD_NUMBER = 1
        TOKEN_SECRET = 'AQA_FLOW_GH'

        QUERY = """
        query($q: String!, $after: String) {
          search(type: ISSUE, query: $q, first: 100, after: $after) {
            pageInfo { hasNextPage endCursor }
            nodes {
              ... on Issue {
                number title body state url
                projectItems(first: 10) {
                  nodes {
                    project { number }
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                    }
                  }
                }
                timelineItems(first: 100, itemTypes: [REFERENCED_EVENT, CROSS_REFERENCED_EVENT, ISSUE_COMMENT]) {
                  nodes {
                    ... on ReferencedEvent { commit { message } }
                    ... on CrossReferencedEvent {
                      source {
                        ... on Issue { title body }
                        ... on PullRequest { title body }
                      }
                    }
                    ... on IssueComment { body }
                  }
                }
              }
            }
          }
        }
        """

        out = {'project_items': '[]', 'milestone_stats': '{}'}

        try:
            token = alita_client.unsecret(TOKEN_SECRET)
            headers = {'Authorization': f'bearer {token}'}
            search = f'repo:EliteaAI/elitea_issues is:issue milestone:"{MILESTONE}" state:open'

            total = 0
            verified = []
            after = None
            while True:
                resp = requests.post(
                    'https://api.github.com/graphql',
                    json={'query': QUERY, 'variables': {'q': search, 'after': after}},
                    headers=headers,
                    timeout=60,
                )
                resp.raise_for_status()
                payload = resp.json()
                if payload.get('errors'):
                    raise RuntimeError(json.dumps(payload['errors'])[:300])
                result = payload['data']['search']

                for node in result['nodes']:
                    if not node:
                        continue
                    total += 1
                    status = ''
                    for pi in (node.get('projectItems') or {}).get('nodes', []):
                        if (pi.get('project') or {}).get('number') == BOARD_NUMBER:
                            status = (pi.get('fieldValueByName') or {}).get('name', '')
                    if status == VERIFIED_STATUS:
                        timeline_text = []
                        for ev in (node.get('timelineItems') or {}).get('nodes', []):
                            if not ev:
                                continue
                            timeline_text.append((ev.get('commit') or {}).get('message') or '')
                            source = ev.get('source') or {}
                            timeline_text.append(f"{source.get('title') or ''} {source.get('body') or ''}")
                            timeline_text.append(ev.get('body') or '')
                        linked_case_ids = sorted(set(re.findall(r'ELITEA-\d+', ' '.join(timeline_text))))
                        # Same shape as the search_issues tool, plus linked_case_ids
                        verified.append({
                            'linked_case_ids': linked_case_ids,
                            'id': node['number'],
                            'title': node.get('title', ''),
                            'description': node.get('body', '') or '',
                            'status': node.get('state', ''),
                            'url': node.get('url', ''),
                            'board_status': status,
                        })

                if not result['pageInfo']['hasNextPage']:
                    break
                after = result['pageInfo']['endCursor']

            out = {
                'project_items': json.dumps(verified),
                'milestone_stats': json.dumps({
                    'milestone': MILESTONE,
                    'status': VERIFIED_STATUS,
                    'open_total': total,
                    'verified_total': len(verified),
                }),
            }
        except Exception as e:
            out['milestone_stats'] = json.dumps({'milestone': MILESTONE, 'status': VERIFIED_STATUS, 'error': str(e)[:300]})

        out
    input: []
    output:
      - project_items
      - milestone_stats
    structured_output: true
    transition: FetchTMSTestCases
  - id: FetchTMSTestCases
    type: code
    code:
      type: fixed
      value: |
        import json
        import re
        import requests

        # Front-matter of every TMS case referenced by the verified issues, read from the
        # case files on main (the index files can lag when build-index does not run).
        TOKEN_SECRET = 'AQA_FLOW_GH'
        TMS_OWNER = 'EliteaAI'
        TMS_NAME = 'onetest-ai-tm-Elitea'
        CASES_DIR = 'tests/automated-full-regression-ui'

        out = {'tms_test_cases': json.dumps({'cases': []})}

        try:
            token = alita_client.unsecret(TOKEN_SECRET)
            headers = {'Authorization': f'bearer {token}'}

            items_raw = alita_state.get('project_items', '[]')
            items = json.loads(items_raw, strict=False) if isinstance(items_raw, str) else items_raw
            wanted = set()
            for it in items if isinstance(items, list) else []:
                text = f"{it.get('title', '') or ''} {it.get('description', '') or ''}"
                wanted |= set(re.findall(r'ELITEA-\d+', text))
                wanted |= set(it.get('linked_case_ids') or [])

            tree = requests.get(
                f'https://api.github.com/repos/{TMS_OWNER}/{TMS_NAME}/git/trees/main?recursive=1',
                headers=headers,
                timeout=60,
            )
            tree.raise_for_status()
            path_re = re.compile(r'^' + re.escape(CASES_DIR) + r'/([^/]+)/(?:.*/)?(ELITEA-\d+)_[^/]*\.md$')
            paths = {}
            for entry in tree.json().get('tree', []):
                m = path_re.match(entry.get('path', ''))
                if m and m.group(2) in wanted:
                    paths[m.group(2)] = {'path': entry['path'], 'module': m.group(1)}

            def fm_field(front_matter, name, default):
                m = re.search(r'^' + name + r':\s*["\']?([^"\'\n#]*)', front_matter, re.M)
                value = m.group(1).strip().lower() if m else ''
                return value or default

            cases = []
            ids = sorted(paths)
            for start in range(0, len(ids), 50):
                chunk = ids[start:start + 50]
                fields = ' '.join(
                    f'c{j}: object(expression: {json.dumps("main:" + paths[cid]["path"])}) {{ ... on Blob {{ text }} }}'
                    for j, cid in enumerate(chunk)
                )
                query = f'query {{ repository(owner: "{TMS_OWNER}", name: "{TMS_NAME}") {{ {fields} }} }}'
                resp = requests.post('https://api.github.com/graphql', json={'query': query}, headers=headers, timeout=60)
                resp.raise_for_status()
                payload = resp.json()
                if payload.get('errors'):
                    raise RuntimeError(json.dumps(payload['errors'])[:300])
                repo = payload['data']['repository']
                for j, cid in enumerate(chunk):
                    text = (repo.get(f'c{j}') or {}).get('text') or ''
                    front_matter = text.lstrip('-\n').split('\n---', 1)[0]
                    cases.append({
                        'id': cid,
                        'path': paths[cid]['path'],
                        'module': paths[cid]['module'],
                        'priority': fm_field(front_matter, 'priority', 'medium'),
                        'execution_type': fm_field(front_matter, 'execution_type', 'manual'),
                        'status': fm_field(front_matter, 'status', 'draft'),
                    })

            out = {'tms_test_cases': json.dumps({'cases': cases})}
        except Exception as e:
            out = {'tms_test_cases': json.dumps({'cases': [], 'error': str(e)[:300]})}

        out
    input:
      - project_items
    output:
      - tms_test_cases
    structured_output: true
    transition: FetchExistingBoardIssues
  - id: FetchExistingBoardIssues
